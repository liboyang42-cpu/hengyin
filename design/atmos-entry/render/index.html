<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Atmosphere entry render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<script type="module">
  import { setup } from './scene.js';
  // Textures are built by prep.py from NASA imagery and served from .cache/textures.
  const bitmap = async (n) => {
    const blob = await (await fetch('./tex/' + n + '.png')).blob();
    return createImageBitmap(blob, { imageOrientation: 'flipY', premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  };
  window.__boot = async (opts) => {
    opts.log = (m) => console.log('[render] ' + m);
    const tex = {};
    for (const n of ['world_day', 'world_aux', 'china_day', 'china_aux']) tex[n] = await bitmap(n);
    const stars = await (await fetch('./tex/stars.json')).json();
    const r = await setup({ tex, stars }, opts);
    window.__render = r.render;
    return { frames: r.FRAMES, fps: r.FPS };
  };
  window.__ready = true;
</script>
</body>
</html>
