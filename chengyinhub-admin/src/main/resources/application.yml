# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  # profile: D:/ruoyi/uploadPath
  profile: /www/wwwroot/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # 内嵌 Tomcat 默认不注册 ThreadPool MBean(Spring Boot 为省内存关掉的),
    # 而 TomcatMetricsProbe 正是查这个 MBean 取 busy/current 线程数 —— 不开就每次采样
    # 必抛 IllegalStateException("tomcat thread pool mbean missing")。
    # 2026-08-01 实证:该探针自上线起就没成功过一次,每轮吐 3 条 ERROR + 堆栈,
    # 是 3.1GB 日志的主要来源之一,同时把告警通道刷成噪音。
    mbeanregistry:
      enabled: true
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    # F-W3-05/F-L6-13:原 800 线程 + 1000 排队对 20 个 DB 连接,高峰时线程全堵在等连接上(最长 60s),
    # 客户端早已超时重试,表现为整站卡死。收敛到 Spring 默认量级(DB 池的 10 倍),配合 Druid maxWait
    # 缩短实现快速失败;容量结论仍需同规格压测,可用环境变量回调而不必改包。
    accept-count: ${CHENGYIN_TOMCAT_ACCEPT_COUNT:200}
    threads:
      # tomcat最大线程数，默认为200
      max: ${CHENGYIN_TOMCAT_MAX_THREADS:200}
      # Tomcat启动初始化的线程数，默认值10
      min-spare: ${CHENGYIN_TOMCAT_MIN_SPARE:20}

security:
  cors:
    allowed-origins: ${CHENGYIN_CORS_ALLOWED_ORIGINS:https://www.chengyinhub.com,https://houtai.chengyinhub.com}

# 日志配置
logging:
  level:
    com.chengyinhub: ${CHENGYIN_LOG_LEVEL:info}
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # Boot 4 temporary bridge: preserve existing Jackson 2 request/response contracts.
  http:
    converters:
      preferred-json-mapper: jackson2
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          # F-W3-05:原 -1ms 无限等待,Redis 抖动时请求线程无限阻塞;改为有限等待后快速失败并触发连接异常告警。
          max-wait: ${CHENGYIN_REDIS_POOL_MAX_WAIT:3s}

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥 [P0-安全] 改为环境变量注入,不再入库;未设 CHENGYIN_JWT_SECRET 启动即报错(fail-fast)
  secret: ${CHENGYIN_JWT_SECRET}
  # 令牌有效期（默认30分钟）   现在已经改成1天了
  expireTime: 1440
  app:
    # 小程序会话空闲有效期：24 小时
    idleTime: 1440
    # 小程序会话绝对有效期：7 天
    absoluteTime: 10080

# 优惠券出示码使用独立密钥；缺少配置时仅关闭签发/核验入口，不能借用 JWT 密钥。
coupon:
  qr-secret: ${COUPON_QR_SECRET:}

# 提现敏感资料 AES-256-GCM 密钥。仅从环境变量注入；未配置即启动失败，禁止明文降级。
withdrawal:
  pii:
    key: ${CHENGYIN_WITHDRAWAL_PII_KEY}
    backfill-limit: ${CHENGYIN_WITHDRAWAL_PII_BACKFILL_LIMIT:0}

# 报名/收货 PII 加密(PiiCryptoService 读 chengyin.pii.*),必须与 withdrawal 用同一把钥匙,
# 故用 property 引用而非另配一把 —— 两把钥匙会让加密与解密对不上,数据永久打不开。
# 缺本段则 chengyin.pii.key 取 @Value 默认空值,加密静默不启用且报名写入被 fail-closed 拒。
chengyin:
  pii:
    key: ${withdrawal.pii.key}
  # 退款人工回执 URL 白名单(逗号分隔 host,精确匹配,只对 HTTPS 绝对地址生效)。
  # 站内路径(/profile/** 等单斜杠路径)始终允许,无需配置;其余 host 一律拒 ——
  # 回执会被另一名财务在人工打款队列里直接点开,白名单是钓鱼/协议注入的唯一闸。
  # 若回执改存对象存储/CDN,必须把该域名补进这里(或 CHENGYIN_REFUND_RECEIPT_ALLOWED_HOSTS),否则登记会被拒。
  refund:
    payout-receipt:
      allowed-hosts: ${CHENGYIN_REFUND_RECEIPT_ALLOWED_HOSTS:www.chengyinhub.com}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.chengyinhub.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
#swagger:
#  # 是否开启swagger
#  # http://localhost:8080/swagger-ui/index.html
#  # http://localhost:8080/dev-api/swagger-ui/index.html
#  enabled: true
#  # 请求前缀
#  pathMapping: /dev-api

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    enabled: ${CHENGYIN_SPRINGDOC_ENABLED:false}
    #path: /dev-api/swagger-ui.html
    path: /swagger-ui.html  # 改回根路径
    tags-sorter: alpha
    operations-sorter: alpha
    # 添加这行确保显示所有分组
    display-request-duration: true
  api-docs:
    enabled: ${CHENGYIN_SPRINGDOC_ENABLED:false}
    #path: /dev-api/v3/api-docs
    path: /v3/api-docs      # 改回根路径
    groups:
      enabled: true

  # 分组配置 - 简化版本
  group-configs:
    # 小程序接口分组
    - group: 'mini-program'
      display-name: '小程序接口'
      paths-to-match: ['/api/**']
      packages-to-scan: ['com.chengyinhub.web.controller.api']
    # 管理后台接口分组
    - group: 'admin-backend'
      display-name: '管理后台接口'
      paths-to-match: ['/business/**', '/common/**', '/monitor/**', '/system/**']
      packages-to-scan:
        - 'com.chengyinhub.web.controller.business'
        - 'com.chengyinhub.web.controller.common'
        - 'com.chengyinhub.web.controller.monitor'
        - 'com.chengyinhub.web.controller.system'

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/api/*

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

