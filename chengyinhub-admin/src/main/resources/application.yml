feature:
  roamRecall:
    enabled: ${CHENGYIN_ROAM_RECALL_ENABLED:false}  # 模板+前端授权 ID 配齐后再开启

# 腾讯位置服务：主题路线规划与服务端逆地理编码
# 申请：https://lbs.qq.com → 创建应用 → 开通 WebServiceAPI
tencent:
  map:
    enabled: ${CHENGYIN_TENCENT_MAP_ENABLED:false}
    key: ${CHENGYIN_TENCENT_MAP_KEY:}
    mode: walking       # 出行方式：walking(步行) / driving / bicycling / transit

# 合规留痕文档版本映射(配置化):发布新版法律文件时改这里即可,无需改代码。
# 版本号真源见发布候选包「17_法律文件总目录与发布说明」;05/06 为 v2.0,其余为 v2.1。
compliance:
  doc-versions:
    privacy_policy: v2.1
    user_service_agreement: v2.2
    photo_model_processing: v1.0
    voice_clone_processing: v1.1   # F-L5C-05:文案新增「非本人声音须已告知并取得声音本人单独同意」,旧同意需重新确认
    community_content_rules: v2.0
    refund_rules: v2.1
    merchant_host_rules: v2.1
    account_cancellation_notice: v2.1
    activity_host_data_sharing: v2.1   # 报名向主办方提供信息的单独同意
    merchant_onsite_data_sharing: v1.0 # 探店日按单店授权姓名/手机号
    bank_account_collection: v1.0      # 提现向城瘾提供持卡人姓名/银行账号/预留手机号

# E4 商业化先做能力，不开放自助收银台。价格/分成/次数/有效期均由 settlement_rule 配置。
merchant:
  commerce:
    self-checkout-enabled: ${CHENGYIN_MERCHANT_SELF_CHECKOUT_ENABLED:false}
  verification-risk:
    high-rate-threshold: ${CHENGYIN_VERIFY_HIGH_RATE_THRESHOLD:0.90}
    one-minute-threshold: ${CHENGYIN_VERIFY_ONE_MINUTE_THRESHOLD:8}
    minimum-sample: ${CHENGYIN_VERIFY_MINIMUM_SAMPLE:5}

# AI 创作助手配置(2026-06-28):多 Provider 架构,dailyLimit/timeoutMs 上提为公共配置
# key 只放后端,经环境变量注入,切勿下发到小程序前端
ai:
  # Enable maintenance only after the intent schema preflight; admission stays independent.
  themeDraftIntent:
    enabled: ${CHENGYIN_AI_THEME_DRAFT_INTENT_ENABLED:false}
    maintenanceEnabled: ${CHENGYIN_AI_THEME_DRAFT_INTENT_MAINTENANCE_ENABLED:false}
  model:
    provider: deepseek  # 已切真模型上线;创作场景经 AiSceneRouter 路由到本 deepseek 客户端
    apiKey: ${CHENGYIN_AI_API_KEY:${CHENGYIN_DEEPSEEK_API_KEY:}}   # 生产必须注入(两个 env 名任一均可);未设则调用返回"AI 繁忙"
    baseUrl: https://api.deepseek.com                              # DeepSeek OpenAI 兼容端点(代码追加 /chat/completions)
    model: deepseek-chat                                           # 稳定别名,始终指向最新 chat 模型;如需更省可换 flash 档
    enabled: true       # 上线开关;真调用前提=上面 apiKey 已在生产环境变量注入
    dailyLimit: 20      # 单用户每日「创作类」AI 调用上限(gen 池:merchant_plan/theme_draft/node_generate/... 共用一个池)
    npcDailyLimit: 100  # 单用户每日「NPC 聊天」上限(npc 池,独立于 gen 池);NPC 是多轮来回,频次量级与创作类不同
    photoDailyLimit: 30 # 单用户每日「拍照审核」上限(photo 池,独立于 gen 池);一局至多 3 个拍照节点 × 每节点 ≤10 次提交 = 30,够一轮极端局 + 余量。共用 gen 池会让拍几张照吃掉创作额度,额度耗尽后审核静默降级(玩家只看到 degraded 标记),真审核悄悄停掉 —— 故独立分池
    timeoutMs: 8000     # 模型调用硬超时(毫秒)
  # 拍照审核视觉模型(预制人生 photoCheck):判断照片有没有拍到作者要求的东西
  # 默认 DeepSeek(2026-08-21 已上线视觉),复用现成的 CHENGYIN_DEEPSEEK_API_KEY,不新增供应商
  # 换阿里云百炼(qwen-vl-max)或别家只改这一段,不改代码;key 未注入 = 拿不到结论,按 fallback 降级,绝不硬拦
  vision:
    enabled: true
    apiKey: ${CHENGYIN_DEEPSEEK_API_KEY:}
    baseUrl: https://api.deepseek.com                         # OpenAI 兼容端点(代码追加 /chat/completions)
    model: deepseek-flash
    timeoutMs: 8000     # 视觉调用硬超时(毫秒)
  # 商品分割抠图(拍物成卡):把物品从背景里抠成透明 PNG 贴纸,再转存我们自己的 OSS
  # 用只授视觉智能权限的 RAM 子账号,两把 key 只从环境变量注入(施工文档 §6),不进代码不进日志不进小程序包
  # 默认关:关着 = 不出贴纸,卡照样铸(抠图是加分项,不是判过的必要条件)
  imageseg:
    enabled: ${CHENGYIN_IMAGESEG_ENABLED:false}
    accessKeyId: ${CHENGYIN_ALIYUN_VIAPI_AK_ID:}
    accessKeySecret: ${CHENGYIN_ALIYUN_VIAPI_AK_SECRET:}
    timeoutMs: 4000     # 单次调用硬超时(毫秒);当场出卡的预算就是 4 秒,不能更宽
  # 抠图结果转存:阿里云回来的临时地址(只活 30 分钟)下载、校验后转进我们自己的桶
  # 没有开关也没有 key:这一步只在上面抠出结果之后发生,上面关着这里就不会被调用
  cutout:
    timeoutMs: 4000     # 单次下载硬超时;4 秒总预算在铸卡外层卡死,这里只保证一次挂起的下载不拖到底
  defaultProvider: mock
  dailyLimit: 20
  timeoutMs: 8000
  providers:
    deepseek:
      enabled: false
      apiKey: ${CHENGYIN_DEEPSEEK_API_KEY:}
      baseUrl: https://api.deepseek.com
      model: deepseek-v4-flash
    minimax:
      enabled: false
      apiKey: ${CHENGYIN_MINIMAX_API_KEY:}
      baseUrl: https://api.minimaxi.com/v1   # 国内主体(.minimaxi.com);国际版为 api.minimax.io。key 与 host 必须同区匹配
      model: MiniMax-M2.7
    mock:
      enabled: true

# 藏品卡(拍物成卡)
object-card:
  naming:
    # AI 认物:卡名用模型认出来的日常叫法,顺带给卡面一个分类(清单见 ObjectNamer)
    # 默认关:关着 = 卡名沿用商家模板名、分类留空,与没接这个功能时一模一样
    # 模型复用上面 ai.vision 那一套配置,但单独一次调用,不参与拍照审核的判定
    enabled: ${CHENGYIN_OBJECT_NAMING_ENABLED:false}

# 告警投递(C3/资损可观测)
# 生产通过环境变量覆盖:ALARM_WEBHOOK、ALARM_FAILURE_WEBHOOK
alarm:
  webhook: ${ALARM_WEBHOOK:}
  failure-webhook: ${ALARM_FAILURE_WEBHOOK:}
  connect-timeout-ms: ${ALARM_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${ALARM_READ_TIMEOUT_MS:5000}
