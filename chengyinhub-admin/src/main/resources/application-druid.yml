# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://127.0.0.1:3306/chengyinhubdb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: chengyinhubdb
                password: ${CHENGYIN_DB_PASSWORD}   # [P0-安全] 环境变量注入,不再入库
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            # F-W3-05:原 60000(60s)远超客户端超时,池满时请求排队一分钟才报错;改为 5s 快速失败,
            # 失败由 RuntimeFailureAlarmFilter 以 runtime.db.connection 告警;可用环境变量回调。
            maxWait: ${CHENGYIN_DB_POOL_MAX_WAIT_MS:5000}
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 生产默认关闭；仅在受限运维网络内显式设为 true 后开放。
                enabled: ${CHENGYIN_DRUID_CONSOLE_ENABLED:false}
                # 默认仅本机；远程运维必须显式声明受限来源 IP。
                allow: ${CHENGYIN_DRUID_ALLOWED_IPS:127.0.0.1}
                url-pattern: /druid/*
                # 控制台管理用户名和密码 [P0-安全] 弱口令 123456 改为环境变量注入
                login-username: ruoyi
                login-password: ${CHENGYIN_DRUID_PASSWORD}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    enabled: true
                    config:
                        multi-statement-allow: false
