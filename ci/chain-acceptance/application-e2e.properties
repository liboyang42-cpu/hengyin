# Chain acceptance fixture overlay (ci/chain_acceptance.py). Layered on the packaged application.yml
# via spring.config.additional-location; never packaged. Secrets come from per-run random env values.
server.port=8099
server.address=127.0.0.1
spring.datasource.druid.master.url=jdbc:mysql://127.0.0.1:3316/cy_e2e_51?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.druid.master.username=root
spring.datasource.druid.master.password=
spring.datasource.druid.slave.enabled=false
spring.datasource.druid.statViewServlet.enabled=false
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=9
spring.data.redis.password=
spring.devtools.restart.enabled=false
ruoyi.profile=${CHAIN_ACCEPTANCE_UPLOAD_DIR}
alarm.webhook=
alarm.failure-webhook=
# Read-only deployment evidence; endpoints retain normal administrator authentication on loopback.
management.endpoints.web.exposure.include=health,info,beans
management.info.git.mode=full
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.isolatedStartup.include=db,redis,livenessState,readinessState
management.endpoint.health.group.isolatedStartup.show-details=when_authorized
