# 缓存可用且不超过七天时允许离线扫描；缺失、损坏或过期的漏洞库一律失败。
# Grype 从 Anchore 的聚合数据库更新，不直接依赖 NVD API，避免 NVD 短暂故障造成永久假红。
db:
  auto-update: true
  validate-by-hash-on-start: true
  validate-age: true
  max-allowed-built-age: 168h
  require-update-check: false

# 目前没有豁免项——有豁免就写在这里,且必须精确到 CVE + 包,不做整仓/整规则级 warn-only
# (见 2026-07-25 整改按重要程度执行说明第三优先级)。
#
# 2026-08-05:原先豁免的 GHSA-mh99-v99m-4gvg(brace-expansion OOM DoS)已删除,不再需要。
# 当时的豁免理由是「1.x 线未见回补,只有 5.0.8+ 有补丁,强行 override 到 5.x 与 minimatch@3
# 的 API 假设不兼容」。该理由现已失效:上游把补丁回补到了 1.1.17,而 2026-08-03 又披露了
# GHSA-rgw5-rvv9-x895(绕过前一条的缓解,同样 HIGH,1.x 修复版 1.1.18)—— 后者不在旧豁免的
# ID 里,直接把 master CI 打红,连带 deploy.yml 因为要求 CI success 而彻底不触发。
# 处置:chengyinhub-ui/package-lock.json 里 brace-expansion 提到 1.1.18(声明范围本就是
# ^1.1.7,不用改 package.json),一次覆盖两条 CVE,豁免随之作废。
#
# ⚠️ 教训:按 CVE ID 豁免,遇到「同包同类的新变种」不会自动覆盖 —— 这是**对的**(新变种就该重新
# 评估),但代价是它会在某天毫无预兆地把 master 打红。豁免不是长期方案,能升版就升版。
