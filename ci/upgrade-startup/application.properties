# Test-only replacement config. Never included in packaged application resources.
spring.application.name=chengyin-isolated-startup
spring.main.allow-circular-references=false
spring.main.lazy-initialization=false
spring.jmx.enabled=true
management.endpoints.jmx.exposure.include=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false
server.port=8080
server.address=127.0.0.1
chengyin.jobs.enabled=false
spring.quartz.auto-startup=false
spring.quartz.job-store-type=memory
withdrawal.pii.backfill-limit=0
chengyin.status.feed-file=/tmp/startup-status.json
wx.pay.enabled=false
wx.sec-check.enabled=true
chengyin.native-steps.app-attest.enabled=false
alarm.webhook=
alarm.failure-webhook=
ai.model.enabled=false
ai.vision.enabled=false
ai.imageseg.enabled=false
ai.voice.enabled=false
ai.voice.asrEnabled=false
ai.providers.deepseek.enabled=false
ai.providers.minimax.enabled=false
object-card.naming.enabled=false
tencent.map.enabled=false
spring.datasource.druid.slave.enabled=false
spring.datasource.druid.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.master.username=startup_probe
spring.datasource.druid.master.password=synthetic-local-only
spring.datasource.druid.initialSize=1
spring.datasource.druid.minIdle=1
spring.datasource.druid.maxActive=3
spring.datasource.druid.maxWait=5000
spring.datasource.druid.connectTimeout=5000
spring.datasource.druid.socketTimeout=5000
spring.datasource.druid.timeBetweenEvictionRunsMillis=60000
spring.datasource.druid.minEvictableIdleTimeMillis=300000
spring.datasource.druid.maxEvictableIdleTimeMillis=900000
spring.datasource.druid.validationQuery=SELECT 1
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=
spring.data.redis.timeout=5s
mybatis.typeAliasesPackage=com.chengyinhub.**.domain
mybatis.mapperLocations=classpath*:mapper/**/*Mapper.xml
mybatis.configLocation=classpath:mybatis/mybatis-config.xml
pagehelper.helperDialect=mysql
token.header=Authorization
token.secret=synthetic-startup-token-not-for-real-use
token.expireTime=30
token.app.idleTime=30
token.app.absoluteTime=60
coupon.qr-secret=synthetic-startup-coupon-not-for-real-use
security.cors.allowed-origins=http://127.0.0.1
swagger.enabled=false
swagger.pathMapping=/
xss.enabled=true
xss.excludes=/system/notice
xss.urlPatterns=/system/*,/monitor/*,/tool/*
ruoyi.name=isolated-startup
ruoyi.version=synthetic
ruoyi.copyrightYear=2026
ruoyi.profile=/tmp/upload
ruoyi.addressEnabled=false
ruoyi.captchaType=math
author=synthetic
packageName=com.chengyinhub
autoRemovePre=false
tablePrefix=
allowOverwrite=false
user.password.maxRetryCount=5
user.password.lockTime=10
# Payment remains DOWN when disabled; do not change the production aggregate health contract.
management.endpoint.health.group.isolatedStartup.exclude=wechatPay
