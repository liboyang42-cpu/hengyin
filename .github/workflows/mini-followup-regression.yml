name: Mini followup focused regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'chengyinhub-admin/**'
      - 'chengyinhub-system/**'
      - '.github/workflows/mini-followup-regression.yml'

permissions:
  contents: read

concurrency:
  group: mini-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-backend:
    name: Followup 39 selected backend cases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --memory=384m --cpus=0.5
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MAVEN_OPTS: -Xmx640m
      CHENGYIN_FUNDS_MYSQL_IT: '1'
      CHENGYIN_NPC_DELETE_IT: '1'
      CHENGYIN_TEST_MYSQL_HOST: 127.0.0.1
      CHENGYIN_TEST_MYSQL_DATABASE_BASE: cy_followup
      CHENGYIN_TEST_MYSQL_DATABASE_SUFFIX: _${{ github.run_id }}_${{ github.run_attempt }}
      CHENGYIN_TEST_MYSQL_USER: root
      CHENGYIN_TEST_MYSQL_PASSWORD: root
      CHENGYIN_MYBATIS_IT_HOST: 127.0.0.1
      CHENGYIN_MYBATIS_IT_DB_SUFFIX: _${{ github.run_id }}
      CHENGYIN_MYBATIS_IT_USER: root
      CHENGYIN_MYBATIS_IT_PASSWORD: root
      VALIDATED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact checkout and record execution start
        env:
          MYSQL_MAPPED_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          echo "CHENGYIN_TEST_MYSQL_PORT=$MYSQL_MAPPED_PORT" >> "$GITHUB_ENV"
          echo "CHENGYIN_MYBATIS_IT_PORT=$MYSQL_MAPPED_PORT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SOURCE_SHA"
          date +%s > /tmp/mini-followup-started-at
      - name: Run explicit unit and real MySQL suites
        run: >-
          mvn -B -pl chengyinhub-admin -am test
          -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=NpcChatServiceTest,ApiAiNpcChatDataTest,NpcChatUserDataMyBatisIT,A02NpcDeleteBarrierMySqlIT,B02TopicEditDetailSnapshotMyBatisTest
          -DargLine=-Xmx384m
      - name: Require every selected test, fresh reports and zero skips
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, time, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
            'com.chengyinhub.business.service.impl.NpcChatServiceTest': 24,
            'com.chengyinhub.web.controller.api.ApiAiNpcChatDataTest': 2,
            'com.chengyinhub.business.it.NpcChatUserDataMyBatisIT': 3,
            'com.chengyinhub.business.service.impl.A02NpcDeleteBarrierMySqlIT': 8,
            'com.chengyinhub.web.controller.api.B02TopicEditDetailSnapshotMyBatisTest': 4,
          }
          started = int(Path('/tmp/mini-followup-started-at').read_text())
          results, failures = [], []
          for name, count in expected.items():
              report = Path('chengyinhub-admin/target/surefire-reports') / ('TEST-' + name + '.xml')
              if not report.is_file() or report.stat().st_mtime < started:
                  failures.append(name + ': missing/stale XML')
                  continue
              root = ET.parse(report).getroot()
              observed = {k: int(root.get(k, '0')) for k in ('tests', 'failures', 'errors', 'skipped')}
              methods = [case.get('name') for case in root.findall('testcase')]
              results.append(dict(suite=name, expected=count, observed=observed, methods=methods))
              if observed != dict(tests=count, failures=0, errors=0, skipped=0) or len(set(methods)) != count:
                  failures.append(name + ': count/status mismatch')
          Path('mini-followup-observed.json').write_text(json.dumps(dict(
              source_sha=os.environ['VALIDATED_SOURCE_SHA'], expected_total=41, suites=results,
              failures=failures, finished_at=int(time.time()), layer='CI_SELECTED_AUTOMATED_ONLY',
              test_deployed=False), indent=2) + '\n')
          assert not failures, failures
          assert sum(s['observed']['tests'] for s in results) == 41
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mini-followup-observed.json
            chengyinhub-admin/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
