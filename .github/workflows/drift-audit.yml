name: Production drift audit

# 生产漂移对账 —— CD 的兵底。
#
# ★ 生产有两个独立制品,本对账**两条轴都要问**,各问各的、各自能红:
#     · 轴一 后端 jar      —— ssh 进去读 jar 自报的 git.commit.id
#     · 轴二 后台前端      —— 从公网 curl version.json,读它自报的 commit
#   漏掉一条轴 = 那个制品的 CD 完全裸奔。2026-07-17 实证:deploy-ui.yml 因生产机没装
#   rsync 连红 4 次、从没成功过一次,而本对账只认识 jar,每 6 小时都在报「✅ 符合预期」——
#   红了 4 次零告警。**这正是对账存在的理由,却恰好是它当时看不见的地方。**
#
# 【为什么需要它】deploy.yml 已把分类 base 改成「问生产 jar 自报的 commit」,丢掉的部署
# 会在**下一次 push** 时自愈。但兜不住这个尾巴:concurrency(cancel-in-progress:false)下
# pending 只排得下一个,若本轮**最后一个** PR 的 run 被挤掉、且此后无人再 push,
# 就没有「下一次」来触发自愈 —— 生产会静默停在旧版,workflow 全绿,零告警。
# 2026-07-16 实测过一次:30 秒内连合 #81→#75→#62,#81/#75 的后端代码静默没上生产。
#
# 它还能兜住另外两种「回执 ≠ 观测」:
#   · self-hosted runner(那台 Mac)睡了/掉线 ⇒ 合并了也不部署,且零告警;
#   · 有人手工换过 jar / 手工传过 dist ⇒ 仓库记录与生产实况脱节。
#
# 【为什么跑在 ubuntu-latest 而不是自托管 runner】
#   自托管 runner 就是那台 Mac。Mac 睡着时 schedule 根本不会跑 —— 而「Mac 睡了」
#   恰恰是本 workflow 要发现的故障之一。用云端 runner 才能在那种时候仍然告警。
#   (补部署仍需 Mac 构建 jar,故触发 deploy.yml 后会排队等它醒 —— 但至少你已经被告警了。)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # 发现漂移时触发 deploy.yml 补部署

concurrency:
  group: drift-audit
  cancel-in-progress: true

env:
  # 2026-07-26:轴二核对的是后台前端,随后台迁到 houtai 子域(www 已让给官网)
  BASE_URL: https://houtai.chengyinhub.com

jobs:
  audit:
    # 定时/手动照常跑;由部署链路触发时只在「那次部署真没跑成」时跑。
    # ⚠️ 必须排除 workflow_dispatch 来源的部署:漂移对账发现漂移会 dispatch 补部署,
    #   若那次补部署也失败而这里不排除,就是 对账→补部署→失败→对账 的无限循环。
    #   排除它不留盲区 —— 补部署失败时漂移依然在,下一个 6 小时窗口照样报红。
    # ⚠️ 结论必须**正列** failure/cancelled/timed_out,不能写 `!= 'success'`:
    #   CI 在 master 上红的时候,两条部署链路照样各建一个 run,prepare 的 if 为假 ⇒
    #   所有 job skipped ⇒ run 整体结论是 `skipped`。那不是「部署没跑成」(本来就没该部署),
    #   把它算进来 = 每次 CI 红都白烧一次云端对账,恰好抵掉把 cron 从 1 小时放宽到 6 小时
    #   省下的额度;而 CI 红本身已经是个告警了。
    if: >-
      github.repository == 'liboyang42-cpu/chengyin' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'workflow_dispatch' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # 0:生产可能落后很多个 commit,浅克隆会让 git diff 找不到那个 base。
          fetch-depth: 0

      - name: Compare production against master (jar + admin UI)
        env:
          ECS_SSH_HOST: ${{ secrets.ECS_SSH_HOST }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT

          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key_file" "$known_hosts"

          # 身份钉死成「只有部署密钥」,理由同 deploy.yml(见 #86):不钉死就可能借到
          # 别的钥匙,让「连得上」变成运气问题。云端 runner 没有用户 config,但显式写死更稳。
          ssh_opts=(-F /dev/null -i "$key_file"
                    -o IdentitiesOnly=yes -o IdentityAgent=none
                    -o BatchMode=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=20)

          tip=$(git rev-parse HEAD)

          # 判据与 deploy.yml / deploy-ui.yml 的 classify 共用同一份真源,不在这里另写正则
          #(理由见 ci/classify-runtime.sh 抬头)。
          source ci/classify-runtime.sh

          # ★ SHA 不一致 ≠ 漂移。
          # 只要最后合的是 ②小程序 / ④CI / ⑤文档 / 纯 sql,该制品本来就该落后 master —— 那是
          # 按文件分类跳过部署的**正确**结果。误把它当漂移会让本 workflow 每 6 小时红一次,
          # 红成噪音之后就没人看了,兵底也就废了。

          # ---------------- 轴一:后端 jar ----------------
          audit_jar() {
            local deployed="" attempt
            # 22 端口长期挨扫(实测当天 3425 次认证失败),sshd MaxStartups 会随机拒 ——
            # 对账每 6 小时跑一次,偶发失败重试即可,不必惊动人。
            for attempt in 1 2 3; do
              if deployed=$(ssh "${ssh_opts[@]}" "$ECS_SSH_USER@$ECS_SSH_HOST" \
                    'unzip -p /www/wwwroot/bin/chengyinhub-admin.jar BOOT-INF/classes/git.properties 2>/dev/null | sed -n "s/^git\.commit\.id=//p" | tr -d "\r"' \
                    2>/dev/null) && [ -n "$deployed" ]; then
                break
              fi
              echo "问生产 jar 失败(第 ${attempt}/3 次),重试…"
              sleep $((attempt * 10))
            done

            if [ -z "$deployed" ]; then
              echo "::error::拿不到生产 jar 自报的 commit —— ssh 不通?jar 不在?服务挂了?这本身就该查"
              return 1
            fi

            echo "master tip : $tip"
            echo "生产 jar   : $deployed"

            if [ "$deployed" = "$tip" ]; then
              echo "✅ 生产 jar 与 master 完全一致"
              return 0
            fi

            if ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
              echo "::error::生产自报 commit=$deployed 不在本仓历史 —— 有人手工换过 jar?或分支被 force-push 过?"
              return 1
            fi

            if ! runtime_changed_between "$deployed" "$tip"; then
              echo "✅ 生产 jar 落后 master,但差异不含后端运行时(②/④/⑤/纯sql/前端各走各的链路)—— 符合预期"
              git diff --name-only "$deployed" "$tip" | sed 's/^/    /'
              return 0
            fi

            echo "::error::🔴 后端漂移:jar 停在 $deployed,而 master 已到 $tip,且差异含运行时改动"
            runtime_files_between "$deployed" "$tip" | sed 's/^/    /'
            echo ""
            echo "触发补部署(force_deploy=false —— 让 deploy.yml 自己按文件分类判断,"
            echo "而不是无脑强推:它的 base 同样取生产 jar,判据也同源,结论会与此处一致)"
            trigger_redeploy deploy.yml
            return 1
          }

          # ---------------- 轴二:后台前端(chengyinhub-ui)----------------
          audit_ui() {
            local live="" attempt
            # ★ 问的是公网,不是 ssh 进去看磁盘 —— 要的就是「用户浏览器现在拿到的是哪一版」。
            #   nginx 根指错、rsync 半路死,都只有从外面看才现形。
            # ⚠️ 只认「解析得出 40 位 hex」,不看 HTTP 码:version.json 不在磁盘上时,nginx 的
            #   SPA catch-all 会拿 index.html 顶上并回 200 —— `curl -I` 看着永远是绿的。
            for attempt in 1 2 3; do
              if live=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
                          "$BASE_URL/version.json?cb=$tip" 2>/dev/null \
                        | sed -n 's/.*"commit":"\([0-9a-f]\{40\}\)".*/\1/p') && [ -n "$live" ]; then
                break
              fi
              echo "问生产 version.json 失败(第 ${attempt}/3 次),重试…"
              sleep $((attempt * 10))
            done

            if [ -z "$live" ]; then
              echo "::error::拿不到生产前端自报的 commit —— version.json 不在磁盘上?nginx 根不对?站点挂了?"
              echo "  (它缺失时 catch-all 会用 index.html 顶成 200,所以这里只认 40 位 hex,不看状态码)"
              return 1
            fi

            echo "master tip : $tip"
            echo "生产前端   : $live"

            if [ "$live" = "$tip" ]; then
              echo "✅ 生产前端与 master 完全一致"
              return 0
            fi

            if ! git cat-file -e "${live}^{commit}" 2>/dev/null; then
              echo "::error::生产前端自报 commit=$live 不在本仓历史 —— 有人手工传过 dist?或分支被 force-push 过?"
              return 1
            fi

            if ! ui_changed_between "$live" "$tip"; then
              echo "✅ 生产前端落后 master,但差异不含 chengyinhub-ui —— 符合预期"
              return 0
            fi

            echo "::error::🔴 前端漂移:生产停在 $live,而 master 已到 $tip,且差异含 chengyinhub-ui 改动"
            ui_files_between "$live" "$tip" | sed 's/^/    /'
            echo ""
            echo "触发补部署(force_deploy=false —— 判据同源,deploy-ui.yml 的结论会与此处一致)"
            trigger_redeploy deploy-ui.yml
            return 1
          }

          # ⚠️ 用 GITHUB_TOKEN 能触发 workflow_dispatch —— 这是 GitHub 防递归规则的**明文例外**:
          #   「events triggered by the GITHUB_TOKEN, **with the exception of workflow_dispatch
          #     and repository_dispatch**, will not create a new workflow run」
          #   别"好心"换成 PAT(平白多一个要轮换的长期凭据),也别因为以为触发不了就把自愈删掉。
          # gh 在 Actions 里默认就是当前仓库,不必传 --repo(少一处把表达式插进 run 的地方)。
          # 触发失败不能吞:那意味着自愈没发生,得让人知道要手动去点。
          trigger_redeploy() {
            bash ci/trigger-redeploy.sh "$1"
          }

          # ★ 两条轴都必须跑完,不能让轴一的失败把轴二挡在后面 —— 那又是一次新的失明,
          #   而且恰恰在「后端已经出事」时最需要知道前端是不是也出事了。
          #   任一轴红,整个对账红。
          fail=0
          echo "==================== 轴一:后端 jar ===================="
          audit_jar || fail=1
          echo ""
          echo "==================== 轴二:后台前端 chengyinhub-ui ===================="
          audit_ui || fail=1

          # 保持红:补部署只是触发,没等它跑完,更没观测到生产真变了。
          # 「已触发」是回执,不是观测 —— 下一次对账(最多 6 小时后)才是真观测。
          exit "$fail"

  migration-drift:
    # 部署失败触发的快速对账只走云端那条轴:迁移落差只在「合了带迁移的 PR」时才新增,
    # 与一次部署失败无关;而这个 job 在 Mac 上,Mac 睡着时它会排队挂住,把整个 run 的
    # 结论拖成 pending —— 那正好毁掉「快速拿到红/绿判决」这唯一的用处。
    if: >-
      github.repository == 'liboyang42-cpu/chengyin' && (github.event_name != 'workflow_run')
    # ★ 跑在自托管 Mac,不在 ubuntu-latest —— 那台机器已经有 ~/.ssh/chengyin_deploy,
    #   ci/run_migration.py 的 SSH_KEY 就是写死的这个路径(没有 env 覆盖)。
    #   换云端 runner 就得改那个文件,而它是生产迁移执行器、带契约测试,不该为接一道
    #   对账去动它。代价说清楚:**Mac 睡着时这个 job 不跑** —— 与轴一/轴二不同,
    #   迁移落差只在「有人合了带迁移的 PR」时才新增,而那件事本身就要 Mac 醒着构建,
    #   所以这个盲区不会掩盖新增落差,只会推迟发现。
    runs-on: [self-hosted, macOS, ARM64, chengyin]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 迁移落库对账(只读 + 双向棘轮)
        env:
          ECS_SSH_HOST: ${{ secrets.ECS_SSH_HOST }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
        run: |
          set -euo pipefail
          # DB 密码不做成 GitHub secret:沿用 ci/preflight-h8-schema.sh 的既有手法 ——
          # ssh 进生产,从应用主进程的 environ 里读。密码只活在这一步的内存里。
          pid=$(ssh -i ~/.ssh/chengyin_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                    "$ECS_SSH_USER@$ECS_SSH_HOST" \
                    'systemctl show -p MainPID --value spring_chengyinhub-admin')
          if [ -z "$pid" ] || [ "$pid" = "0" ]; then
            echo "::error::取不到后端主进程 PID —— 服务没在跑或单元名变了,拒绝猜测"
            exit 1
          fi
          CHENGYIN_DB_PASSWORD=$(ssh -i ~/.ssh/chengyin_deploy -o IdentitiesOnly=yes \
                    -o BatchMode=yes "$ECS_SSH_USER@$ECS_SSH_HOST" \
                    "tr '\0' '\n' < /proc/$pid/environ | sed -n 's/^CHENGYIN_DB_PASSWORD=//p'")
          if [ -z "$CHENGYIN_DB_PASSWORD" ]; then
            echo "::error::生产进程 environ 里没有 CHENGYIN_DB_PASSWORD —— 拒绝空密码连库"
            exit 1
          fi
          export CHENGYIN_DB_PASSWORD
          python3 ci/audit_migrations_applied.py --check-baseline
