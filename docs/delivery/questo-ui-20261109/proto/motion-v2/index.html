<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城瘾 动效 v2</title>
<style>
:root{--ink:#f5f3ee;--mute:rgba(245,243,238,.56);--bg:#0b0b0e;--panel:#141418;--line:rgba(255,255,255,.08);
--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1)}
:root[data-look="stardust"]{--lk-bg:#06070c;--lk-bg2:#141a2e;--lk-a:#d9e6ff;--lk-b:#8fb2ff;--lk-ink:#f2f5ff;--lk-on:#0a0d18}
:root[data-look="paper"]{--lk-bg:#17140f;--lk-bg2:#2a231a;--lk-a:#e2593e;--lk-b:#f0c48a;--lk-ink:#f6efe3;--lk-on:#fff}
:root[data-look="survival"]{--lk-bg:#0f1113;--lk-bg2:#26241f;--lk-a:#ff8a3d;--lk-b:#ffd27a;--lk-ink:#f1ece4;--lk-on:#1a1208}
:root[data-look="cyber"]{--lk-bg:#06060b;--lk-bg2:#120c24;--lk-a:#3ce8f2;--lk-b:#ff4fd8;--lk-ink:#eefcff;--lk-on:#04121a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:14px 20px;background:rgba(11,11,14,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);overflow-x:auto}
.top h1{font-size:15px;font-weight:700;white-space:nowrap;margin-right:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#000;border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);flex:none}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
section.m{display:none;grid-template-columns:minmax(0,1fr) 390px minmax(0,300px);gap:28px;align-items:start}
section.m.on{display:grid}
.ref{border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line)}
.ref video{display:block;width:100%;height:auto}
.ref .cap{padding:10px 14px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--mute);margin-bottom:8px}
.spec h2{font-size:20px;line-height:1.25;margin-bottom:10px}
.spec ol{padding-left:18px;color:var(--mute);font-size:13px}
.spec ol li{margin:6px 0}
.spec ol b{color:var(--ink);font-weight:600}
.spec .t{font:12px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap}
.replay{margin-top:14px;width:100%;border:0;border-radius:999px;padding:12px;background:var(--ink);color:#000;font-weight:600;cursor:pointer}
@media (max-width:1100px){section.m.on{grid-template-columns:1fr}.phone{margin:0 auto}}

/* phone */
.phone{position:relative;width:390px;height:844px;border-radius:54px;background:var(--lk-bg);overflow:hidden;box-shadow:0 0 0 10px #1c1c20,0 0 0 11px #2c2c31,0 40px 80px rgba(0,0,0,.6);isolation:isolate;color:var(--lk-ink)}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font-size:15px;font-weight:600;z-index:40;pointer-events:none}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:41}
.capsule{position:absolute;top:54px;right:14px;width:88px;height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);z-index:40;display:flex;align-items:center;justify-content:space-around;font-size:14px}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.7);z-index:40}
.amb{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 38%,var(--lk-bg2),var(--lk-bg) 70%);z-index:0}
.stage{position:absolute;inset:0;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-size:16px;font-weight:600;border:0}
.btn.pri{background:var(--lk-ink);color:#000}
.btn.acc{background:var(--lk-a);color:var(--lk-on)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--lk-ink)}
.fade{opacity:0;transform:translateY(14px);transition:opacity .5s var(--out),transform .6s var(--out)}
.fade.in{opacity:1;transform:none}

/* M1 chapter seal (heyozi + 3 acts) */
.m1 .seal{position:absolute;left:50%;top:300px;width:220px;height:220px;margin:-110px 0 0 -110px}
.m1 .dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--lk-a);box-shadow:0 0 24px 6px var(--lk-a);transform:scale(0)}
.m1 .ring{position:absolute;inset:0;border-radius:50%}
.m1 .ring i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--lk-a);opacity:0}
.m1 .num{position:absolute;inset:0;display:grid;place-items:center}
.m1 .num svg{width:120px;height:90px;overflow:visible}
.m1 .num circle{fill:var(--lk-ink);opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2)}
.m1 .halo{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lk-a) 38%,transparent),transparent 62%);opacity:0;transform:scale(.6)}
.m1 .rays{position:absolute;inset:-140px;opacity:0;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--lk-a) 16%,transparent) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}
.m1 .kick{position:absolute;top:470px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.24em;color:color-mix(in srgb,var(--lk-ink) 60%,transparent)}
.m1 .title{position:absolute;top:494px;left:24px;right:24px;text-align:center;font-size:28px;font-weight:700;letter-spacing:.02em;min-height:40px}
.m1 .title span{opacity:0;filter:blur(6px);display:inline-block;transition:opacity .5s,filter .5s}
.m1 .title span.in{opacity:1;filter:none}
.m1 .stats{position:absolute;top:560px;left:0;right:0;display:flex;justify-content:center;gap:48px}
.m1 .stats div{text-align:center}
.m1 .stats b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.m1 .stats span{font-size:12px;color:color-mix(in srgb,var(--lk-ink) 50%,transparent)}
.m1 .cta{position:absolute;left:24px;right:24px;bottom:42px}
.m1 .share{position:absolute;top:58px;left:20px;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;z-index:30}

/* M2 pack (insporadesign) */
.m2 .pack{position:absolute;left:50%;top:330px;width:200px;height:280px;margin:-140px 0 0 -100px;border-radius:14px;cursor:pointer;
background:conic-gradient(from 210deg at 60% 40%,#d7f2ff,#f8d7ff,#fff3c9,#c9ffe9,#d6dcff,#d7f2ff);box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.6);transform-origin:50% 60%;animation:float 3.2s ease-in-out infinite}
.m2 .pack::before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 46%,transparent 60%);background-size:260% 100%;animation:sheen 2.6s ease-in-out infinite;mix-blend-mode:overlay}
.m2 .pack::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 6px,transparent 6px 12px)}
.m2 .pack .lg{position:absolute;left:18px;top:34px;font-size:22px;font-weight:800;color:#141420;letter-spacing:.02em}
.m2 .pack .sub{position:absolute;left:18px;top:64px;font-size:11px;color:rgba(20,20,32,.6)}
.m2 .pack .em{position:absolute;left:50%;top:58%;width:96px;height:96px;margin:-48px;border-radius:28px;transform:rotate(45deg);background:linear-gradient(145deg,#fff,#c9ccff 60%,#8e94ff);box-shadow:0 12px 30px rgba(80,90,255,.35)}
.m2 .pack .ct{position:absolute;left:18px;bottom:16px;font-size:11px;color:rgba(20,20,32,.55)}
.m2 .tap{position:absolute;top:510px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.24em;color:color-mix(in srgb,var(--lk-ink) 50%,transparent)}
.m2 .title{position:absolute;top:120px;left:24px;right:24px;text-align:center}
.m2 .title b{display:block;font-size:24px}
.m2 .title span{font-size:13px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent)}
.m2 .cards{position:absolute;inset:0;pointer-events:none}
.m2 .card{position:absolute;left:50%;top:330px;width:136px;height:190px;margin:-95px 0 0 -68px;border-radius:14px;overflow:hidden;opacity:0;box-shadow:0 18px 36px rgba(0,0,0,.45);transition:transform .9s var(--spring),opacity .3s}
.m2 .card .art{position:absolute;inset:8px 8px 52px;border-radius:9px}
.m2 .card .nm{position:absolute;left:10px;bottom:24px;font-size:14px;font-weight:700;color:#111}
.m2 .card .st{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(0,0,0,.55)}
.m2 .card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:sheen 3.4s ease-in-out infinite}
.m2 .burst{position:absolute;left:50%;top:300px;width:10px;height:10px;margin:-5px;pointer-events:none}
.m2 .burst i{position:absolute;width:8px;height:14px;border-radius:2px;opacity:0}
.m2 .again{position:absolute;left:24px;right:24px;bottom:42px}

/* M3 finale (BThree/AdamPolify) */
.m3 .core{position:absolute;left:50%;top:330px;width:150px;height:150px;margin:-75px}
.m3 .orb{position:absolute;inset:0;border-radius:44px;transform:rotate(45deg) scale(.4);opacity:0;background:linear-gradient(145deg,color-mix(in srgb,var(--lk-b) 70%,#fff),var(--lk-a));box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 20px 60px color-mix(in srgb,var(--lk-a) 50%,transparent)}
.m3 .orb::after{content:"";position:absolute;inset:16%;border-radius:30px;border:2px solid rgba(255,255,255,.75)}
.m3 .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 39%,#fff,color-mix(in srgb,var(--lk-a) 60%,transparent) 30%,transparent 60%);opacity:0;z-index:5;pointer-events:none}
.m3 .ringx{position:absolute;left:50%;top:330px;width:300px;height:80px;margin:-40px 0 0 -150px;border-radius:50%;border:2px solid color-mix(in srgb,var(--lk-a) 80%,#fff);opacity:0;transform:scale(.3)}
.m3 .pt{position:absolute;left:50%;top:330px;width:3px;height:3px;border-radius:50%;background:var(--lk-b);opacity:0}
.m3 .medal{position:absolute;left:50%;top:310px;width:132px;height:132px;margin:-66px;border-radius:50%;opacity:0;transform:translateY(40px) scale(.7);
background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--lk-b) 80%,#fff) 25%,var(--lk-a) 70%,color-mix(in srgb,var(--lk-a) 60%,#000));box-shadow:0 0 0 6px rgba(255,255,255,.12),0 24px 60px color-mix(in srgb,var(--lk-a) 45%,transparent)}
.m3 .medal::after{content:"";position:absolute;inset:26%;border-radius:50%;border:3px solid rgba(255,255,255,.85);border-left-color:transparent;transform:rotate(-30deg)}
.m3 .kick{position:absolute;top:426px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.24em;color:color-mix(in srgb,var(--lk-ink) 60%,transparent)}
.m3 .ttl{position:absolute;top:452px;left:24px;right:24px;text-align:center;font-size:26px;font-weight:700}
.m3 .row{position:absolute;top:520px;left:24px;right:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m3 .row div{text-align:center;border-radius:18px;padding:14px 0 12px;border:1.5px solid color-mix(in srgb,var(--lk-a) 55%,transparent);background:color-mix(in srgb,var(--lk-a) 10%,transparent)}
.m3 .rays{position:absolute;left:50%;top:310px;width:560px;height:560px;margin:-280px;opacity:0;background:repeating-conic-gradient(color-mix(in srgb,var(--lk-a) 22%,transparent) 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 58%);mask:radial-gradient(circle,#000 12%,transparent 58%)}
.m3 .row b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.m3 .row span{font-size:12px;color:color-mix(in srgb,var(--lk-ink) 50%,transparent)}
.m3 .acts{position:absolute;left:24px;right:24px;bottom:42px;display:grid;gap:10px}
.m3 .acts .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* M4 payment (Jakubantalik + desdivj) */
.m4 .page{position:absolute;inset:0;padding:100px 20px 0}
.m4 h3{font-size:28px;margin-bottom:6px}
.m4 .meta{font-size:13px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent);margin-bottom:18px}
.m4 .tk{border-radius:22px;background:rgba(255,255,255,.06);padding:18px;display:flex;align-items:center;gap:14px;transition:background .6s,transform .6s var(--ease)}
.m4 .tk .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px;transition:background .6s}
.m4 .tk b{display:block;font-size:16px}
.m4 .tk span{font-size:12px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent)}
.m4 .tk .st{margin-left:auto;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);transition:all .5s}
.m4 .tk.paid{background:color-mix(in srgb,var(--lk-a) 16%,rgba(255,255,255,.04))}
.m4 .tk.paid .ic{background:var(--lk-a)}
.m4 .tk.paid .st{background:var(--lk-a);color:var(--lk-on)}
.m4 .dim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
.m4 .sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:38px;background:#1a1a1f;padding:22px 20px 20px;transform:translateY(110%);transition:transform .56s var(--ease),height .56s var(--ease);z-index:10;overflow:hidden}
.m4 .sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:-10px auto 14px}
.m4 .sheet .amt{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.m4 .sheet .to{text-align:center;font-size:13px;color:rgba(255,255,255,.55);margin-bottom:16px}
.m4 .sheet .ln{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.m4 .sheet .ln span{color:rgba(255,255,255,.55)}
.m4 .pay{margin-top:16px;position:relative;overflow:hidden;transition:all .45s var(--ease)}
.m4 .pay .sp{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#000;animation:spin .8s linear infinite;display:none}
.m4 .ok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s .1s}
.m4 .ok svg{width:64px;height:64px}
.m4 .ok path{stroke:var(--lk-on);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.m4 .ok .c{width:76px;height:76px;border-radius:50%;background:var(--lk-a);display:grid;place-items:center;transform:scale(.4);transition:transform .6s var(--spring)}
.m4 .ok b{margin-top:14px;font-size:20px}
.m4 .ok span{font-size:13px;color:rgba(255,255,255,.55)}
.m4 .edge{position:absolute;inset:0;border-radius:54px;pointer-events:none;z-index:30;opacity:0;
background:conic-gradient(from var(--ang,0deg),var(--lk-a),var(--lk-b),#fff,var(--lk-a));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;filter:blur(2px)}
.m4 .edge2{position:absolute;inset:0;pointer-events:none;z-index:29;opacity:0;box-shadow:inset 0 0 60px 10px color-mix(in srgb,var(--lk-a) 55%,transparent)}

/* M5 sheet with in-place checks (desdivj) */
.m5 .page{position:absolute;inset:0;padding:100px 20px 0}
.m5 .card{border-radius:22px;background:rgba(255,255,255,.06);padding:16px 18px;margin-top:14px;overflow:hidden;transition:max-height .55s var(--ease),opacity .4s,margin .55s var(--ease),padding .55s var(--ease);max-height:140px}
.m5 .card.gone{max-height:0;opacity:0;margin-top:0;padding-top:0;padding-bottom:0}
.m5 .card b{font-size:16px}
.m5 .card .sub{font-size:13px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent);transition:color .4s}
.m5 .card .row{display:flex;align-items:center;margin-top:12px}
.m5 .av{width:28px;height:28px;border-radius:50%;border:2px solid var(--lk-bg);margin-right:-8px;position:relative}
.m5 .card .go{margin-left:auto;height:34px;padding:0 16px;border-radius:17px;background:var(--lk-ink);color:#000;font-weight:600;font-size:13px;display:flex;align-items:center;transition:all .45s var(--ease)}
.m5 .card.sent .go{background:var(--lk-a);color:var(--lk-on)}
.m5 .card.sent .sub{color:var(--lk-a)}
.m5 .ph{border-radius:22px;background:rgba(255,255,255,.04);height:120px;margin-top:14px}
.m5 .dim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
.m5 .sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:38px;background:#1a1a1f;padding:22px 20px 20px;transform:translateY(110%);transition:transform .56s var(--ease);z-index:10}
.m5 .sheet h4{font-size:20px}
.m5 .sheet .s{font-size:13px;color:var(--lk-a);margin-bottom:10px}
.m5 .p{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.m5 .p .av{margin:0;width:38px;height:38px}
.m5 .p .av .ck{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--lk-a);display:grid;place-items:center;transform:scale(0);transition:transform .5s var(--spring)}
.m5 .p .av .ck svg{width:11px;height:11px}
.m5 .p.ok .av .ck{transform:scale(1)}
.m5 .p b{font-size:15px;display:block}
.m5 .p span{font-size:12px;color:rgba(255,255,255,.5)}
.m5 .p em{margin-left:auto;font-style:normal;font-size:13px;color:rgba(255,255,255,.55)}
.m5 .send{margin-top:14px;transition:background .45s,color .45s,transform .2s}
.m5 .send.done{background:var(--lk-a);color:var(--lk-on)}

/* M6 card -> detail (Kubai087) */
.m6 .list{position:absolute;inset:0;padding:96px 20px 0;transition:opacity .4s}
.m6 .lt{font-size:32px;font-weight:700;margin-bottom:16px;transition:all .5s var(--ease)}
.m6 .tc{border-radius:24px;overflow:hidden;background:rgba(255,255,255,.06);margin-bottom:14px;cursor:pointer}
.m6 .tc .cv{height:170px}
.m6 .tc .tx{padding:14px 16px}
.m6 .tc b{font-size:18px;display:block}
.m6 .tc span{font-size:12px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent)}
.m6 .fly{position:absolute;z-index:20;border-radius:24px;overflow:hidden;transition:all .56s var(--ease);pointer-events:none}
.m6 .det{position:absolute;inset:0;z-index:15;opacity:0;pointer-events:none;overflow-y:auto;scrollbar-width:none}
.m6 .det.on{opacity:1;pointer-events:auto}
.m6 .det .hero{height:420px}
.m6 .det .body{padding:18px 20px 120px;background:var(--lk-bg);margin-top:-30px;border-radius:30px 30px 0 0;position:relative}
.m6 .det h3{font-size:30px;line-height:1.2}
.m6 .det p{font-size:14px;color:color-mix(in srgb,var(--lk-ink) 60%,transparent);margin:10px 0 18px}
.m6 .det .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.m6 .det .kv div{border-radius:16px;background:rgba(255,255,255,.06);padding:12px}
.m6 .det .kv b{font-size:20px;display:block}
.m6 .det .kv span{font-size:11px;color:color-mix(in srgb,var(--lk-ink) 50%,transparent)}
.m6 .nav{position:absolute;top:50px;left:0;right:0;height:46px;z-index:25;display:flex;align-items:center;padding:0 112px 0 16px;opacity:0;pointer-events:none;transition:opacity .3s}
.m6 .nav.on{opacity:1;pointer-events:auto}
.m6 .nav .bk{width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer}
.m6 .nav .nt{margin-left:10px;font-size:16px;font-weight:600;opacity:0;transform:translateY(8px);transition:all .35s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m6 .nav.solid{background:color-mix(in srgb,var(--lk-bg) 82%,transparent);backdrop-filter:blur(20px)}
.m6 .nav.solid .nt{opacity:1;transform:none}
.m6 .bar{position:absolute;left:20px;right:20px;bottom:34px;z-index:26;opacity:0;transform:translateY(20px);transition:all .5s var(--ease) .2s}
.m6 .det.on~.bar{opacity:1;transform:none}

/* M7 more menu + QR (Kubai menu) */
.m7 .page{position:absolute;inset:0;padding:100px 20px 0}
.m7 .stn{border-radius:24px;background:rgba(255,255,255,.06);padding:18px;margin-top:220px}
.m7 .stn b{font-size:22px}
.m7 .stn p{font-size:13px;color:color-mix(in srgb,var(--lk-ink) 55%,transparent);margin:6px 0 14px}
.m7 .stn .two{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.m7 .more{position:absolute;top:54px;right:14px;width:44px;height:32px;z-index:42;cursor:pointer}
.m7 .menu{position:absolute;top:92px;right:14px;width:230px;border-radius:24px;background:rgba(36,36,42,.92);backdrop-filter:blur(24px);z-index:44;padding:6px;transform-origin:92% 0;transform:scale(.2);opacity:0;transition:transform .42s var(--ease),opacity .25s;pointer-events:none}
.m7 .menu.on{transform:none;opacity:1;pointer-events:auto}
.m7 .mi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;font-size:15px;cursor:pointer;opacity:0;transform:translateY(-6px);transition:all .3s var(--ease)}
.m7 .menu.on .mi{opacity:1;transform:none}
.m7 .mi:hover{background:rgba(255,255,255,.06)}
.m7 .mi.red{color:#ff6b5e}
.m7 .dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .35s;pointer-events:none;z-index:43}
.m7 .sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:38px;background:#1a1a1f;padding:22px 20px 24px;transform:translateY(110%);transition:transform .56s var(--ease);z-index:45;text-align:center}
.m7 .stub{position:relative;margin:16px 6px 14px;border-radius:24px;background:#f6f5f2;color:#111;padding:22px 20px 16px;text-align:left}
.m7 .stub::before,.m7 .stub::after{content:"";position:absolute;top:244px;width:22px;height:22px;border-radius:50%;background:#1a1a1f}
.m7 .stub::before{left:-11px}.m7 .stub::after{right:-11px}
.m7 .qr{width:196px;height:196px;margin:0 auto 18px;background:#fff;padding:8px;border-radius:12px}
.m7 .perf{border-top:2px dashed rgba(0,0,0,.14);margin:0 -4px 12px}
.m7 .kvr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.m7 .kvr span{color:rgba(0,0,0,.45)}
.m7 .qr svg{width:100%;height:100%}

@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const R=(n,c)=>({n,c});
const MOMENTS={
 1:{ref:R('heyozi','heyozi：一个光点长成形状，字一个个写出来，分享最后出现'),

    t:'卡包',
    spec:['<b>静止</b> 卡包悬浮、慢慢掠光，标题在上','<b>点开 0–250ms</b> 轻抖一下，顶边撕开','<b>250ms</b> 外观色彩带与碎片从开口喷出','<b>300–1200ms</b> 卡片依次弹出、扇形展开（弹簧）','<b>1400ms</b> 收成一行，每张卡持续掠光','<b>1700ms</b> 「再开一包」最后出现'],
    tm:'弹簧    cubic-bezier(.34,1.56,.64,1) 900ms\n错峰    每张 90ms\n碎片    36 片，外观色'},
 3:{ref:R('BThreeAgency','BThreeAgency / AdamPolify：蓄力→闪光→奖励升起→标题→按钮最后'),
    t:'通关',
    spec:['<b>第一幕 0–900ms</b> 粒子向中心汇聚，核心旋转放大','<b>第二幕 900ms</b> 白光一闪，光环向外扩散','<b>第三幕 1100–1700ms</b> 勋章从下方升起落定','<b>1700ms</b> 「已通关」与主题名','<b>2000ms</b> 读数卡','<b>2400ms</b> 保存 · 分享一行，查看结算为主按钮'],
    tm:'只有一个主角：勋章\n不再出现：大logo、重叠卡片、残影标题'},

    t:'支付',
    spec:['<b>点支付</b> 按钮缩成加载态（不跳页）','<b>到账</b> 屏幕边缘一圈外观色光扫过','<b>同时</b> 半屏收成成功卡，对勾描出','<b>1.6s</b> 半屏自动收起','<b>回到原页</b> 票卡原地变成「已购」，不新开页面'],
    tm:'边缘光  1.2s 一圈\n半屏    .56s cubic-bezier(.32,.72,0,1)\n成功卡停留 1.1s'},
 5:{ref:R('desdivj','desdivj：逐行打勾→按钮变色→半屏收起→原卡更新后收走'),
    t:'邀请同行',
    spec:['<b>点「邀请」</b> 半屏升起','<b>发送</b> 三位同行人依次打勾（间隔 160ms）','<b>按钮</b> 原地变成「已发出」','<b>700ms 后</b> 半屏收起','<b>原卡</b> 文案变成「已邀请 3 人 · 刚刚」，再优雅收起'],
    tm:'勾     弹簧 .5s\n收起    max-height .55s'},
 6:{ref:R('Kubai087','Kubai087：卡片长成页面，标题同字号移动；滚动时标题收进导航栏'),
    t:'主题卡→详情',
    spec:['<b>点卡片</b> 封面从卡片位置长成详情页头图（不白屏、不跳页）','<b>同时</b> 列表淡出，返回键与报名栏出现','<b>向上滚</b> 大标题收进导航栏','<b>返回</b> 头图缩回原卡片'],
    tm:'.56s cubic-bezier(.32,.72,0,1)\n导航标题 .35s'},

function phone(inner,cls){return `<div class="phone ${cls}"><div class="amb"></div><div class="island"></div><div class="sb"><span>9:41</span><span>􀙇 􀛨</span></div><div class="capsule">••• ◉</div><div class="stage">${inner}</div><div class="home"></div></div>`}

function render(m){
  const d=MOMENTS[m];
  document.getElementById('main').innerHTML=`<section class="m on">
   <div><div class="lbl">参考</div><div class="ref">${/shot/.test(location.search)?'<div style="height:300px"></div>':`<video src="ref/${d.ref.n}.mp4" autoplay muted loop playsinline></video>`}<div class="cap">${d.ref.c}</div></div></div>

  </section>`;
  document.getElementById('rp').onclick=()=>run(m);

function dotDigits(str){ // 5x7 dot font for 0-9
  const F={'0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],'2':['01110','10001','00001','00110','01000','10000','11111'],'3':['11110','00001','00001','01110','00001','00001','11110']};
  let out='',x0=0;
  for(const ch of str){F[ch].forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='1')out+=`<circle cx="${(x0+x)*12+6}" cy="${y*12+6}" r="4.6" data-o="${(x0+x)+y*2}"/>`}));x0+=6}
  return `<svg viewBox="0 0 ${x0*12-12} 84">${out}</svg>`;
}

async function run(m){
  const my=++token; const alive=()=>my===token;
  const ph=document.getElementById('ph');
  if(m===1){
    ph.innerHTML=phone(`<div class="share">􀈂</div><div class="m1"><div class="seal"><div class="rays"></div><div class="halo"></div><div class="ring">${Array.from({length:28},(_,i)=>`<i style="transform:rotate(${i*360/28}deg) translateY(-104px)"></i>`).join('')}</div><div class="num">${dotDigits('01')}</div><div class="dot"></div></div>
    <div class="kick fade">第 1 章 / 共 2 章</div><div class="title" id="t1"></div>
    <div class="stats fade"><div><b id="s1">00:00</b><span>用时</span></div><div><b id="s2">0/2</b><span>坐标</span></div><div><b id="s3">0.0</b><span>公里</span></div></div>
    <div class="cta fade"><div class="btn pri">下一站 · 星图时间轴</div></div></div>`,'');
    const P=ph.querySelector('.phone'), dot=P.querySelector('.dot');
    dot.animate([{transform:'scale(0)'},{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'});
    await sleep(300); if(!alive())return;
    P.querySelectorAll('.ring i').forEach((el,i)=>{el.animate([{opacity:0,transform:el.style.transform.replace('-104px','0px')},{opacity:1,transform:el.style.transform}],{duration:700,delay:i*14,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'})});
    dot.animate([{opacity:1},{opacity:0}],{duration:300,delay:200,fill:'forwards'});
    P.querySelectorAll('.num circle').forEach(c=>{const o=+c.dataset.o;c.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'}],{duration:380,delay:350+o*32,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards'})});
    await sleep(800); if(!alive())return;
    P.querySelector('.halo').animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.05)'},{opacity:.7,transform:'scale(1)'}],{duration:900,easing:'ease-out',fill:'forwards'});
    P.querySelector('.rays').animate([{opacity:0,transform:'rotate(0)'},{opacity:.9,transform:'rotate(20deg)'},{opacity:.35,transform:'rotate(40deg)'}],{duration:1600,easing:'ease-out',fill:'forwards'});
    P.querySelector('.ring').animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:60000,iterations:Infinity});
    await sleep(200); if(!alive())return;
    P.querySelector('.kick').classList.add('in');
    const t=P.querySelector('#t1'); const words=['第一章',' · ','星尘','落点'];
    t.innerHTML=words.map(w=>`<span>${w}</span>`).join('');
    for(const s of t.children){await sleep(180); if(!alive())return; s.classList.add('in')}
    await sleep(250); P.querySelector('.stats').classList.add('in');
    countTo(P.querySelector('#s1'),356,800,v=>`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`);
    countTo(P.querySelector('#s2'),2,700,v=>`${v}/2`); countTo(P.querySelector('#s3'),6,800,v=>(v/10).toFixed(1));
    await sleep(500); if(!alive())return; P.querySelector('.cta').classList.add('in');
  }
  if(m===2){
    ph.innerHTML=phone(`<div class="m2"><div class="title fade in"><b>星尘卡包</b><span>本章 5 张 · 第 1 包</span></div>
      <div class="pack" id="pk"><div class="lg">城瘾</div><div class="sub">星尘便笺 · 人民广场</div><div class="em"></div><div class="ct">5 张</div></div>
      <div class="tap">轻点开启</div><div class="burst" id="bs"></div><div class="cards" id="cs"></div><div class="again fade"><div class="btn ghost">收进卡册</div></div></div>`,'');
    const P=ph.querySelector('.phone'); const pk=P.querySelector('#pk');
    pk.onclick=async()=>{ if(pk.dataset.o)return; pk.dataset.o=1; const my2=token;
      pk.style.animation='none';
      await pk.animate([{transform:'rotate(0)'},{transform:'rotate(-4deg) scale(1.03)'},{transform:'rotate(4deg) scale(1.05)'},{transform:'rotate(0) scale(1.06)'}],{duration:260,easing:'ease-in-out'}).finished;
      if(my2!==token)return;
      P.querySelector('.tap').style.opacity=0; P.querySelector('.title').style.opacity=0;
      pk.animate([{transform:'scale(1.06)',opacity:1},{transform:'translateY(60px) scale(.9)',opacity:0}],{duration:420,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'});
      const bs=P.querySelector('#bs'); const cols=getComputedStyle(document.documentElement);

      const cs=P.querySelector('#cs');
      const C=[['星尘信号','第一粒',['#ffd9d9','#ff8f8f']],['台阶','第二粒',['#d9e6ff','#7b8cff']],['档案馆','第三粒',['#e9ffd0','#a6e34f']],['夜空','第四粒',['#e6d9ff','#8e5cff']],['邮差','第五粒',['#fff1c9','#ffb02e']]];

  if(m===3){

      <div class="row fade"><div><b>4/4</b><span>坐标</span></div><div><b>27:00</b><span>用时</span></div><div><b>0.5</b><span>公里</span></div></div>
      <div class="acts fade"><div class="two"><div class="btn ghost">保存图片</div><div class="btn ghost">分享</div></div><div class="btn acc">查看结算</div></div></div>`,'');
    const P=ph.querySelector('.phone');
    P.querySelectorAll('.pt').forEach((p,i)=>{const a=Math.random()*Math.PI*2,r=180+Math.random()*120;p.animate([{opacity:0,transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`},{opacity:1,offset:.3},{opacity:0,transform:'translate(0,0)'}],{duration:900,delay:i*12,easing:'cubic-bezier(.55,0,.8,.2)',fill:'forwards'})});
    const orb=P.querySelector('.orb');
    orb.animate([{opacity:0,transform:'rotate(45deg) scale(.4)'},{opacity:1,transform:'rotate(225deg) scale(.9)'},{opacity:1,transform:'rotate(405deg) scale(1.1)'}],{duration:900,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'});
    await sleep(900); if(!alive())return;
    P.querySelector('.flash').animate([{opacity:0},{opacity:1},{opacity:0}],{duration:600,easing:'ease-out'});
    orb.animate([{opacity:1},{opacity:0,transform:'rotate(405deg) scale(1.6)'}],{duration:240,fill:'forwards'});
    P.querySelector('.ringx').animate([{opacity:1,transform:'scale(.3)'},{opacity:0,transform:'scale(2.4)'}],{duration:1100,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
    await sleep(200); if(!alive())return;
    const ry=P.querySelector('.rays'); ry.animate([{opacity:0,transform:'rotate(0) scale(.6)'},{opacity:1,transform:'rotate(30deg) scale(1)'}],{duration:900,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}); ry.animate([{transform:'rotate(30deg)'},{transform:'rotate(390deg)'}],{duration:40000,delay:900,iterations:Infinity});
    P.querySelector('.medal').animate([{opacity:0,transform:'translateY(40px) scale(.7)'},{opacity:1,transform:'translateY(-6px) scale(1.03)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:700,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'});
    P.querySelector('.medal').animate([{filter:'brightness(1)'},{filter:'brightness(1.25)'},{filter:'brightness(1)'}],{duration:3000,delay:700,iterations:Infinity});
    for(const [s,d] of [['.kick',600],['.ttl',150],['.row',300],['.acts',400]]){await sleep(d); if(!alive())return; P.querySelector(s).classList.add('in')}
  }
  if(m===4){
    ph.innerHTML=phone(`<div class="m4"><div class="page"><h3>星尘便笺</h3><div class="meta">城市定向 · 人民广场 · 2 章 4 站</div>
      <div class="tk" id="tk"><div class="ic">􀎸</div><div><b>主题门票</b><span>可玩至 2 月 9 日</span></div><div class="st">¥0.01</div></div>
      <div class="btn pri" style="margin-top:16px" id="buy">购买</div></div>
      <div class="dim"></div><div class="edge2"></div><div class="edge"></div>

       <div class="btn pri pay" id="pay"><span class="lb">微信支付</span><i class="sp"></i></div></div>
       <div class="ok"><div class="c"><svg viewBox="0 0 64 64"><path d="M18 33 l9 9 l19 -20"/></svg></div><b>已购买</b><span>票已放进票夹</span></div></div></div>`,'');

function countTo(el,to,ms,fmt){const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/ms);const e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(to*e));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
