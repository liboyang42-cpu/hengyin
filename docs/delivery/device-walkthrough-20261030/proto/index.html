<title>城瘾商家走查 v2 原型</title>
<style>
/* Layout: left rail of screens + state chips, one phone at true 390pt scale; phone content is the fixed merchant-light app skin. */
:root{
  --page:#E9EAEC; --ink:#111; --muted:#5f6368; --rail:#fff; --line:#d9dbde; --hl:#2F6BFF;
  /* app skin (style/merchant-light.wxss) */
  --a-bg:#F3F4F4; --a-card:#FFFFFF; --a-sub:#EEEEEE; --a-strong:#E4E4E4; --a-t1:#000; --a-t2:#404040; --a-t3:#6B6B6B; --a-line:#E8E8E8;
  --ok:#1E9E5A; --okbg:#E3F5EA; --warn:#B26B00; --warnbg:#FFF1D6; --bad:#D93B3B; --pink:#D6338A; --pinkbg:#FBE4F0; --blue:#2F6BFF; --bluebg:#E5EDFF;
  --f:-apple-system,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#16171a;--ink:#eee;--muted:#a3a7ad;--rail:#202226;--line:#33363b;color-scheme:dark}}
:root[data-theme="dark"]{--page:#16171a;--ink:#eee;--muted:#a3a7ad;--rail:#202226;--line:#33363b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);margin:0;padding-inline:16px;padding-block:20px}
.wrap{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.rail{flex:1 1 300px;max-width:420px;min-width:0;background:var(--rail);border-radius:16px;padding:18px;border:1px solid var(--line)}
.rail h1{font-size:18px;margin:0 0 4px}
.rail .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.5}
.scr{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.scr button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.scr button small{color:var(--muted);font-size:11.5px}
.scr button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.scr button[aria-pressed="true"] small{color:var(--page);opacity:.7}
.scr button:focus-visible,.st button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:10px 0 6px}
.st{display:flex;flex-wrap:wrap;gap:6px}
.st button{all:unset;cursor:pointer;font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.st button[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:#fff}
.notes{font-size:13px;line-height:1.6;color:var(--ink);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.notes li{margin-bottom:6px}
.notes b{font-weight:600}
.q{background:color-mix(in srgb,var(--hl) 10%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-top:10px}

/* ===== phone ===== */
.phone{width:390px;max-width:100%;height:844px;border-radius:46px;background:#000;padding:10px;flex:none;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--a-bg);color:var(--a-t1);font-family:var(--f);font-size:15px}
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-weight:600;font-size:15px;z-index:60;pointer-events:none}
.cap{position:absolute;top:52px;right:10px;width:87px;height:32px;border-radius:16px;background:rgba(255,255,255,.75);border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-around;z-index:61}
.cap i{width:4px;height:4px;border-radius:50%;background:#000;box-shadow:-7px 0 #000,7px 0 #000}
.cap span{width:16px;height:16px;border-radius:50%;border:2px solid #000;position:relative}
.cap span:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#000}
.cap:before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:.5px;background:rgba(0,0,0,.15)}
.nav{position:absolute;top:47px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;z-index:5}
.nav .bk{position:absolute;left:14px;font-size:24px;cursor:pointer;line-height:1}
.body{position:absolute;top:91px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.big{font-size:30px;font-weight:800;margin:6px 0 14px;letter-spacing:.01em}
.card{background:var(--a-card);border-radius:20px}
.row{display:flex;align-items:center;gap:12px}
.t2{color:var(--a-t2)} .t3{color:var(--a-t3);font-size:13px}
.pill{all:unset;cursor:pointer;background:#000;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;white-space:nowrap;text-align:center}
.pill.g{background:var(--a-sub);color:#000}
.pill.sm{padding:6px 12px;font-size:13px}
.pill:active{transform:scale(.96)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.c-ok{background:var(--okbg);color:var(--ok)} .c-warn{background:var(--warnbg);color:var(--warn)} .c-blue{background:var(--bluebg);color:var(--blue)} .c-grey{background:var(--a-sub);color:var(--a-t2)} .c-pink{background:var(--pinkbg);color:var(--pink)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec h3{margin:0;font-size:18px;font-weight:700}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(243,244,244,.94);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding-top:10px;z-index:8;border-top:.5px solid var(--a-line)}
.tabbar div{width:28px;height:28px;border-radius:7px;border:2.2px solid #444;opacity:.8}
.tabbar div.on{border-color:#6B4EFF;opacity:1}
.new{outline:2px dashed var(--hl);outline-offset:3px;border-radius:14px}
.newtag{position:absolute;transform:translateY(-14px);background:var(--hl);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;z-index:3}

/* sheets: full-screen merchant style, stackable */
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--a-bg);border-radius:24px 24px 0 0;z-index:30;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.sheet.under{transform:scale(.94) translateY(-10px);filter:brightness(.92)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:29}
.scrim.on{opacity:1;pointer-events:auto}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;position:relative}
.sh-h:before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--a-strong);transform:translateX(-50%)}
.sh-h h2{font-size:22px;margin:18px 0 6px;font-weight:800}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:var(--a-sub);display:grid;place-items:center;font-size:17px;margin-top:12px}
.sh-b{flex:1;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.list{background:var(--a-card);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--a-line)}
.li:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.sq{width:52px;height:52px;border-radius:12px;flex:none}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{width:51px;height:31px;border-radius:16px;background:var(--a-strong);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog.on{background:#34C759}.tog.on:after{transform:translateX(20px)}
.seg{display:flex;background:var(--a-sub);border-radius:999px;padding:3px;margin:6px 0 12px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:14px;padding:7px 0;border-radius:999px;color:var(--a-t2)}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* stepper (shedsgns) */
.stp{display:flex;align-items:center;gap:0;margin:10px 0 4px}
.stp .n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;color:#fff;background:var(--a-strong);transition:background .3s}
.stp .n.done{background:var(--pink)}
.stp .n.run{background:#fff;border:2px solid var(--pink);position:relative}
.stp .n.run:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.2s infinite}
.stp .l{flex:1;height:2px;background:var(--a-strong);position:relative;overflow:hidden}
.stp .l.done:after{content:"";position:absolute;inset:0;background:var(--pink);animation:fill .5s ease-out both}
.stp-lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--a-t3)}
@keyframes fill{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1);opacity:1}}
.vt{position:relative;padding-left:26px}
.vt .it{position:relative;padding:6px 0 10px;font-size:14px}
.vt .it:before{content:"";position:absolute;left:-19px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--a-strong)}
.vt .it.done:before{background:var(--pink)}
.vt .it.run:before{background:#fff;border:2px solid var(--pink);width:10px;height:10px}
.vt .it:after{content:"";position:absolute;left:-12px;top:25px;bottom:-6px;width:2px;background:var(--a-strong)}
.vt .it.done:after{background:var(--pink)}
.vt .it:last-child:after{display:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--pinkbg);border-top-color:var(--pink);animation:sp 1s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.ns{position:relative;transition:height .45s cubic-bezier(.3,1.2,.4,1)}
.ns-i{position:absolute;left:0;right:0;height:64px;background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:0 14px;transition:transform .45s cubic-bezier(.3,1.25,.4,1),opacity .3s;cursor:pointer}
.ns-ic{width:40px;height:40px;border-radius:11px;background:#000;color:#fff;display:grid;place-items:center;flex:none;font-size:18px}
.ns-tm{position:absolute;top:10px;right:14px;font-size:11px;color:var(--a-t3)}
.ns-dot{position:absolute;bottom:12px;right:16px;width:7px;height:7px;border-radius:50%;background:#000}
.ns-x{position:absolute;right:12px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;background:var(--a-sub);display:none;place-items:center;font-size:13px}
.ns.open .ns-x{display:grid}.ns.open .ns-dot{display:none}
.ns-clear{all:unset;cursor:pointer;display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--a-t3);padding:10px 0;width:100%;transition:opacity .3s}
.ns-done{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px 8px 8px;font-size:13px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.08);animation:pop .45s cubic-bezier(.3,1.6,.4,1)}
.ns-done i{width:24px;height:24px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* skeleton */
.sk{background:linear-gradient(90deg,#ECEFF3 25%,#F6F8FA 37%,#ECEFF3 63%);background-size:400% 100%;animation:shim 1.4s infinite;border-radius:8px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* intro sheet morph */
.blob{width:150px;height:150px;margin:10px auto 6px;position:relative}
.blob div{position:absolute;inset:0;border-radius:42%;transition:all .6s cubic-bezier(.3,1.3,.4,1);box-shadow:inset -14px -18px 30px rgba(0,0,0,.25),inset 10px 12px 24px rgba(255,255,255,.55),0 18px 30px rgba(0,0,0,.18)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 16px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--a-strong);transition:width .3s}
.dots i.on{width:18px;background:#000}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.phone{height:780px;border-radius:40px;padding:6px}.screen{border-radius:34px}}
</style>

<div class="wrap">
<section class="rail" aria-label="原型控制">
  <h1>商家走查 version2 · 原型</h1>
  <p class="sub">对应 Obsidian「真机走查问题（玩家版）」version2 段 IMG_0736–0762。虚线蓝框 = 本次新增或改动的位置；其余沿用真机现有页面。</p>
  <div class="lbl">页面</div>
  <div class="scr" id="scr"></div>
  <div class="lbl">状态</div>
  <div class="st" id="st"></div>
  <div class="notes" id="notes"></div>
</section>
<div class="phone"><div class="screen" id="ph">
  <div class="sb"><span>14:08</span><span>5G ▮</span></div>
  <div class="cap"><i></i><span></span></div>
  <div id="view"></div>
  <div class="scrim" id="scrim"></div>
  <div id="sheets"></div>
  <div class="toast" id="toast"></div>
</div></div>
</div>

 if(k=='club'){sheet('合作俱乐部',clubSheet())}
 if(k=='clubHome'){const c=CLUBS[i];sheet(c[0],`<div style="height:140px;border-radius:18px;background:${c[1]};opacity:.85"></div><div class="row" style="margin:-28px 0 0 16px"><div class="av" style="width:64px;height:64px;background:${c[1]};border:4px solid var(--a-bg)">${c[0][0]}</div></div><div style="font-weight:700;font-size:20px;margin-top:8px">${c[0]}</div><div class="t3">${c[2]} · 公开加入</div><div class="sec"><h3 style="font-size:16px">最近活动</h3></div><div class="list"><div class="li"><div class="grow"><div class="ttl">周六城市定向 · 莘庄</div><div class="t3">11-02 14:00 · 12 人</div></div></div><div class="li"><div class="grow"><div class="ttl">外滩夜行</div><div class="t3">10-26 · 已结束</div></div></div></div>${c[3]?'':`<button class="pill" style="display:block;margin-top:20px" data-act="inviteClub" data-i="${i}">邀约这个俱乐部</button>`}`,{back:1})}
 if(k=='recruit'){sheet('招商',`<div class="row" style="gap:4px;margin-bottom:6px">${[1,1,0,0].map(x=>`<div style="flex:1;height:4px;border-radius:2px;background:${x?'#000':'var(--a-strong)'}"></div>`).join('')}</div><div class="t3" style="margin-bottom:12px">已招 2/4 站 · 权益档按章节固定</div>
  <div class="list">${[['1933老场坊','星巴克咖啡厅',COV.old],['上海邮政博物馆','',''],['四行仓库抗战纪念馆','',''],['M50创意园','城市运动装备馆',COV.heat]].map((s,i)=>`<div class="li">${s[2]?`<div class="sq" style="background:${s[2]}"></div>`:`<div class="sq" style="border:1.5px dashed var(--a-strong);display:grid;place-items:center;color:var(--a-t3)">+</div>`}<div class="grow"><div class="ttl">${s[0]}</div><div class="t3">${s[1]?'已承接 · '+s[1]:'引流型 · 无分成'}</div></div>${s[1]?'<span class="chip c-ok">已招</span>':`<button class="pill sm" data-act="recruitStation" data-i="${i}">招商</button>`}</div>`).join('')}</div>
  <div class="sec"><h3 style="font-size:16px">收到的申请 · 1</h3></div><div class="list"><div class="li"><div class="av" style="background:#b26b00">茶</div><div class="grow"><div class="ttl">苏河茶室</div><div class="t3">申请承接 · 上海邮政博物馆</div></div><button class="pill sm" data-act="ok">通过</button><button class="pill sm g" data-act="no">不通过</button></div></div>`)}
 if(k=='recruitStation'){sheet('邀请商家 · 第 '+(+i+1)+' 站',`<div class="card" style="padding:14px 16px;margin-bottom:12px"><div class="t3">本站权益档</div><div style="font-weight:700;margin-top:4px">引流型 · 无分成</div><div class="t3" style="margin-top:4px">档位由章节决定，商家只能按这一档接受</div></div><div class="t3" style="margin:0 4px 8px">附近 1km 的商家</div><div class="list">${[['苏河茶室','茶饮 · 320m'],['一尺花园','咖啡 · 480m'],['老码头书店','书店 · 760m']].map(m=>`<div class="li"><div class="sq" style="width:44px;height:44px;background:${COV.stamp}"></div><div class="grow"><div class="ttl">${m[0]}</div><div class="t3">${m[1]}</div></div><button class="pill sm" data-act="inviteMer">邀约</button></div>`).join('')}</div>`,{back:1})}
 if(k=='cust'){const sold=S.state.sold==1;sheet('客户',sold?`<div class="row" style="justify-content:flex-end;margin:-6px 0 8px"><button class="pill sm g new" data-act="broadcast">📣︎ 广播</button></div><div class="t3" style="margin:0 4px 8px">还没到店 · 22</div><div class="list">${['阿乔 · 11-02 14:00','小林 · 11-02 15:30','Mia · 11-03 10:00'].map((x,i)=>`<div class="li"><div class="av" style="background:${['#6B4EFF','#D6338A','#2F6BFF'][i]};width:36px;height:36px">${x[0]}</div><div class="grow ttl">${x}</div><span class="chip c-warn">未到店</span></div>`).join('')}</div><div class="t3" style="margin:18px 4px 8px">已核销 · 14</div><div class="list">${['周周 · 10-30 16:12','Kai · 10-30 11:40'].map(x=>`<div class="li"><div class="av" style="background:#999;width:36px;height:36px">${x[0]}</div><div class="grow ttl">${x}</div><span class="chip c-ok">已核销</span></div>`).join('')}</div>`:
  `${EMPTY('未开售票')}<div style="text-align:center"><div class="t3" style="margin-top:6px">开售后，买票的玩家会出现在这里</div><button class="pill" style="display:inline-block;margin-top:14px" data-act="toast" data-m="进入票价与主题内容">去设置票价</button></div>`)}
 if(k=='broadcast'){sheet('定向广播',`<div style="font-weight:600;margin:4px 2px 8px">范围</div><div class="row" style="gap:8px;flex-wrap:wrap" id="bcScope">${['全部买票玩家','还没到店','已核销'].map((x,j)=>`<span class="chip ${j?'c-grey':''}" data-act="bcScope" data-i="${j}" style="${j?'':'background:#000;color:#fff'};padding:7px 13px;cursor:pointer">${x}</span>`).join('')}</div>
  <div style="font-weight:600;margin:16px 2px 8px">内容<span style="color:var(--bad)">*</span></div><textarea id="bcText" maxlength="200" placeholder="输入广播内容" style="width:100%;min-height:120px;border:0;border-radius:14px;padding:12px 14px;font:inherit;background:#fff;resize:none"></textarea>
  <div class="list" style="margin-top:12px"><div class="li"><div class="grow">发送前预览</div><span class="t3" id="bcCount">36 人</span></div></div>
  <button class="pill" style="display:block;width:100%;margin-top:16px;padding:13px 0" data-act="sent">确认发送</button><div class="t3" style="text-align:center;margin-top:8px">已送达以站内发送记录为准</div>`,{back:1})}
 if(k=='more'){const open=S.state.open==1;sheet('更多',`<div class="list"><div class="li new" data-act="toast" data-m="进入主题专业配置" style="cursor:pointer"><div class="grow">编辑主题</div><span class="t3">›</span></div><div class="li"><div class="grow">权益票夹</div><span class="t3">›</span></div><div class="li"><div class="grow">票价与主题内容</div><span class="t3">›</span></div></div>
  <div class="list" style="margin-top:12px"><div class="li"><div class="grow">开放商家承接申请</div><div class="tog ${open?'on':''}" data-act="openTog"></div></div>${open?'<div class="li new"><div class="grow">邀请其他商家</div><span class="t3">›</span></div>':''}</div>
  <div class="list" style="margin-top:12px"><div class="li" style="color:var(--bad)">结束本章</div></div>`)}
 if(k=='profit'){sheet('分润明细',`<div class="card" style="padding:16px"><div class="t3">本主题已入账</div><div style="font-size:34px;font-weight:700;font-style:italic">¥${S.state.sold==1?'420.00':'0.00'}</div><div class="t3">待结算 ¥${S.state.sold==1?'1,080.00':'0.00'} · 每月 5 日结上月</div></div>
  <div class="sec"><h3 style="font-size:16px">每一档怎么分</h3></div>
  ${[['体验档','¥68 / 份',[['主办',40],['承接商家',35],['带团俱乐部',15],['平台',10]],S.state.sold==1?24:0],['引流档','¥0 / 份',[['承接商家',100]],S.state.sold==1?12:0]].map(t=>`<div class="card" style="padding:14px 16px;margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${t[0]}</b><span class="t3">${t[1]} · 已售 ${t[3]}</span></div><div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 8px">${t[2].map((p,i)=>`<div style="width:${p[1]}%;background:${['#000','#6B4EFF','#1E9E5A','#bbb'][i]}"></div>`).join('')}</div>${t[2].map((p,i)=>`<div class="row" style="justify-content:space-between;font-size:13.5px;padding:3px 0"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${['#000','#6B4EFF','#1E9E5A','#bbb'][i]};margin-right:6px"></i>${p[0]}</span><span>${p[1]}%</span></div>`).join('')}</div>`).join('')}
  <div class="t3" style="text-align:center;margin-top:8px">示例比例；真实比例读主题条款快照</div>`)}
 if(k=='inv'){const c=['【零元续测0929】自由探索供给','自由探索合作验收0929','副本人生 · 莘庄公园','预制人生 · 第一站'][i];sheet('协作邀请',`<div class="card" style="padding:16px"><div style="font-weight:700;font-size:18px">${c}</div><div class="t3" style="margin:2px 0 14px">到店探索 · 引流型 · 无分成</div>
  <div class="vt"><div class="it done">对方发出邀请 <span class="t3" style="float:right">10-27</span></div><div class="it done">你已查看</div><div class="it done">你已接受 <span class="t3" style="float:right">10-28</span></div><div class="it run">补供给 <span class="chip c-warn" style="float:right">待你处理</span><div class="t3" style="margin-top:6px;line-height:1.9">✓ 门店照片<br>✓ 接待时段<br><span class="spin"></span> 到店权益说明</div></div><div class="it">上线</div></div></div>
  <button class="pill" style="display:block;margin-top:16px">补到店权益说明</button>`)}
 if(k=='emore'){sheet('更多',`<div class="list">${['提现记录','邀请记录'].map(x=>`<div class="li"><div class="grow">${x}</div><span class="t3">›</span></div>`).join('')}</div><div class="new" style="margin-top:10px;font-size:12px;color:var(--hl);padding:6px;text-align:center">「结算明细」已删，和「明细」重复</div>`)}
 if(k=='edet'){sheet('收益明细',`<div class="row" style="gap:8px;margin-bottom:12px">${['全部','创作收益','品牌收益','主办分润'].map((x,i)=>`<span class="chip ${i?'c-grey':''}" style="${i?'':'background:#000;color:#fff'};padding:6px 12px">${x}</span>`).join('')}</div><div class="t3" style="margin:0 4px 8px">10 月</div><div class="list"><div class="li"><div class="grow"><div class="ttl">预制人生 · 第一站</div><div class="t3">主办分润 · 10-28</div></div><b>+¥420.00</b></div></div>`)}
 if(k=='intro')intro();
}
const INTRO=[['它是你店在城瘾里的分身','出现在漫游地图和店铺主页上'],['路过的玩家会和它打招呼','它按你的招呼语和性格说话'],['它能回答菜单和营业时间','读你门店资料里的内容'],['起个名字、选个性格就能用','温柔 / 可爱 / 毒舌，随时可改']];
function intro(){let i=0;const el=sheet('',`<div style="text-align:center"><div class="new" style="display:inline-block;margin-top:6px;position:relative"><span class="newtag">城瘾积木 logo</span>${logoSvg('ilg')}</div><div id="it" style="font-weight:700;font-size:20px;margin-top:10px"></div><div id="is" class="t3" style="margin-top:6px"></div><div class="dots" id="dots">${INTRO.map(()=>'<i></i>').join('')}</div><button class="pill" id="inext" style="display:block;width:100%;padding:14px 0">下一步</button></div>`);
 el.style.top='auto';el.style.height='560px';el.style.borderRadius='28px';el.style.left='8px';el.style.right='8px';el.style.bottom='8px';
 const paint=()=>{const d=INTRO[i];el.querySelectorAll('.lp').forEach(g=>{g.style.transform=LOGO_STEPS[i][g.dataset.p]||'none'});const bub=el.querySelector('.lbub');bub.style.opacity=i==3?1:0;bub.style.transform=i==3?'scale(1)':'scale(.2)';el.querySelector('#it').textContent=d[0];el.querySelector('#is').textContent=d[1];el.querySelectorAll('#dots i').forEach((x,j)=>x.classList.toggle('on',j==i));el.querySelector('#inext').textContent=i==3?'知道了':'下一步'};
 paint();el.querySelector('#inext').onclick=()=>{if(i<3){i++;paint()}else{S.seen=true;pop()}}}


let MSGS,NSOPEN=false;
function resetMsgs(){MSGS=[['✉︎','城瘾小助手','你的门店资料已通过审核','2分钟前'],['⇄','协作邀请','夜跑上海邀请你承接第 2 站','12分钟前'],['✓','核销到账','阿乔 到店核销 · +¥68.00','1小时前']];NSOPEN=false}
resetMsgs();
function paintNS(){const h=$('#nsHost');if(!h)return;
 if(!MSGS.length){h.innerHTML='<div style="text-align:center;padding:14px 0"><span class="ns-done"><i>✓</i>都看完了</span></div>';return}
 const n=MSGS.length,gap=8,H=64;
 const height=NSOPEN?n*H+(n-1)*gap:H+Math.min(n-1,2)*10;
 h.innerHTML=`<div class="ns ${NSOPEN?'open':''}" style="height:${height}px">${MSGS.map((m,i)=>{const t=NSOPEN?`translateY(${i*(H+gap)}px)`:`translateY(${Math.min(i,2)*10}px) scale(${1-Math.min(i,2)*.05})`;return `<div class="ns-i" data-act="nsTap" data-i="${i}" style="transform:${t};z-index:${10-i};${!NSOPEN&&i>2?'opacity:0':''}"><div class="ns-ic" style="${!NSOPEN&&i?'visibility:hidden':''}">${m[0]}</div><div class="grow" style="${!NSOPEN&&i?'visibility:hidden':''}"><div class="ttl" style="font-size:15px">${m[1]}</div><div class="t3 ttl">${m[2]}</div></div><span class="ns-tm" style="${!NSOPEN&&i?'visibility:hidden':''}">${m[3]}</span><span class="ns-dot"></span><span class="ns-x" data-act="nsX" data-i="${i}" aria-label="标为已读">×</span></div>`}).join('')}</div>
 <button class="ns-clear" data-act="${NSOPEN?'nsClear':'nsTap'}" style="opacity:${NSOPEN?1:0};pointer-events:${NSOPEN?'auto':'none'}">🗑︎ 清空（全部标为已读）</button>`}
/* ---------- render ---------- */
function render(){
 closeAll();const sc=SCREENS[S.screen];
 $('#scr').innerHTML=Object.entries(SCREENS).map(([k,v])=>`<button aria-pressed="${k==S.screen}" data-scr="${k}"><span>${v.name}</span><small>${v.ref}</small></button>`).join('');
 $('#st').innerHTML=Object.entries(sc.states).map(([k,arr])=>arr.map((l,i)=>`<button aria-pressed="${(S.state[k]||0)==i}" data-k="${k}" data-v="${i}">${l}</button>`).join('')).join('<span style="width:8px"></span>');
 $('#notes').innerHTML=sc.notes+(S.screen=='ws'?'<div class="q">点「俱乐部 / 招商 / 客户 / 更多 / 结算 →」打开主题内弹窗；俱乐部里「主页」、招商里「招商」会再叠一层，左上 ‹ 返回上一层。</div>':S.screen=='msg'?'<div class="q">点任一邀请卡看全屏详情；开关可直接拨。</div>':'');
 Object.keys(sc.states).forEach(k=>{if(S.state[k]==null)S.state[k]=0});
 $('#view').innerHTML=sc.render(S.state);
 if(S.screen=='npc'&&S.state.first!=1&&!S.seen)setTimeout(intro,350);
 if(S.screen=='home'){resetMsgs();paintNS()}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-scr]');if(b){S.screen=b.dataset.scr;S.state={};S.seen=false;render();return}
 const s=e.target.closest('[data-k]');if(s){S.state[s.dataset.k]=+s.dataset.v;if(s.dataset.k=='first')S.seen=false;render();return}
 if(e.target.id=='scrim'){pop();return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=a.dataset.i;
 if(act=='pop')return pop(); if(act=='closeAll')return closeAll();
 if(act=='nsX'){e.stopPropagation();MSGS.splice(+i,1);if(MSGS.length<2)NSOPEN=MSGS.length>0&&NSOPEN;paintNS();return toast('已读')}
 if(act=='nsTap'){if(!NSOPEN&&MSGS.length>1){NSOPEN=true;return paintNS()}return toast('打开「'+MSGS[+i||0][1]+'」')}
 if(act=='nsClear'){const items=document.querySelectorAll('.ns-i');items.forEach((el,k)=>{el.style.transform='translateY(0) scale(.9)';el.style.opacity=k?0:1});setTimeout(()=>{MSGS=[];paintNS();toast('全部已读')},420);return}
 if(act=='remind'){a.classList.toggle('on');return toast(a.classList.contains('on')?'新邀约会提醒你':'已关闭新邀约提醒')}
 if(act=='openTog'){S.state.open=S.state.open==1?0:1;pop();setTimeout(()=>openSheet('more'),430);return}
 if(act=='inviteClub'){CLUBS[i][3]='invited';const top=S.stack[S.stack.length-1];if(top&&top.querySelector('#clubList')){top.querySelector('.sh-b').innerHTML=clubSheet()}else{pop();setTimeout(()=>{const t=S.stack[S.stack.length-1];if(t)t.querySelector('.sh-b').innerHTML=clubSheet()},430)}return toast('已邀约，等对方回复')}
 if(act=='inviteMer'){a.outerHTML='<span class="chip c-pink"><span class="spin"></span> 已邀约</span>';return toast('已邀约，档位：引流型 · 无分成')}
 if(act=='ok'||act=='no'){a.parentElement.querySelectorAll('button').forEach(x=>x.remove());a.parentElement.insertAdjacentHTML('beforeend',act=='ok'?'<span class="chip c-ok">已通过</span>':'<span class="chip c-grey">未通过</span>');return}
 if(act=='bcScope'){document.querySelectorAll('#bcScope .chip').forEach((c,j)=>{const on=j==+i;c.className='chip '+(on?'':'c-grey');c.style.background=on?'#000':'';c.style.color=on?'#fff':''});document.getElementById('bcCount').textContent=['36 人','22 人','14 人'][+i];return}
 if(act=='sent'){const n=(document.getElementById('bcCount')||{}).textContent||'';pop();return toast('已发送给 '+n)}
 if(act=='toast')return toast(a.dataset.m);
 if(act=='like'){const on=a.dataset.on!='1';a.dataset.on=on?'1':'0';a.textContent=(on?'♥ ':'♡ ')+(on?13:12);a.style.color=on?'#D93B3B':'';return}
 openSheet(act,i);
});
render();
</script>
