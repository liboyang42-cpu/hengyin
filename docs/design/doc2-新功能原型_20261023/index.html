<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doc2 新功能原型</title>
<style>
/* ===== 外框（评审台）===== */
:root{--desk:#0E0E10;--desk2:#17171A;--desk3:#232327;--deskT:#F2F2F7;--deskT2:#A1A1A8;--deskLine:rgba(255,255,255,.08);--deskAcc:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--desk);color:var(--deskT);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.desk{display:grid;grid-template-columns:232px 1fr 340px;height:100vh;height:100dvh}
.rail{background:var(--desk2);border-right:1px solid var(--deskLine);overflow:auto;padding:18px 12px 24px}
.rail h1{font-size:17px;font-weight:800;letter-spacing:-.2px;padding:0 8px 2px}
.rail .sub{font-size:12px;color:var(--deskT2);padding:0 8px 14px}
.rail .fk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 8px;border-radius:10px}
.rail .fk:hover{background:var(--desk3)}
.rail .fk.on{background:#fff;color:#000}
.rail .fk .tag{flex:none;width:30px;height:22px;border-radius:6px;background:var(--desk3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rail .fk.on .tag{background:#000;color:#fff}
.rail .fk b{display:block;font-size:13px}
.rail .fk small{display:block;font-size:11px;color:var(--deskT2);margin-top:1px}
.rail .fk.on small{color:#555}
.rail .sec{font-size:11px;color:var(--deskT2);padding:14px 8px 6px;letter-spacing:.5px}
.rail .scr{display:block;width:100%;text-align:left;padding:5px 8px 5px 48px;font-size:12px;color:var(--deskT2);border-radius:8px}
.rail .scr:hover{color:var(--deskT);background:var(--desk3)}
.rail .scr.on{color:#fff;font-weight:700}
.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage .scaler{transform-origin:center center;flex:none}
.panel{background:var(--desk2);border-left:1px solid var(--deskLine);overflow:auto;padding:18px 16px 30px}
.panel h2{font-size:16px;font-weight:800}
.panel .ph{font-size:12px;color:var(--deskT2);margin:2px 0 14px}
.panel h3{font-size:12px;color:var(--deskT2);font-weight:600;margin:18px 0 8px;letter-spacing:.4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 10px;border-radius:999px;background:var(--desk3);font-size:12px}
.seg button.on{background:#fff;color:#000;font-weight:700}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--deskLine);font-size:12px}
.tg code{font-size:11px;color:var(--deskT2);display:block;word-break:break-all}
.sw{flex:none;width:38px;height:22px;border-radius:11px;background:#3A3A3C;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#30D158}.sw.on:after{left:18px}
.ep{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 8px;border-radius:8px;background:var(--desk);margin-bottom:5px;word-break:break-all;color:var(--deskT2)}
.ep b{color:#fff;font-weight:700;margin-right:4px}
.ep.hot{outline:1px solid #fff;color:#fff}
.ep i{display:block;font-style:normal;font-family:-apple-system,"PingFang SC",sans-serif;color:var(--deskT2);font-size:11px}
.ep.gap{border:1px dashed #FF9F0A}
.ep.gap b{color:#FF9F0A}
.qq{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--desk);margin-bottom:6px;line-height:1.5}
.qq b{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#FF9F0A;color:#000;margin-right:6px}
.note{font-size:12px;color:var(--deskT2);line-height:1.55}
.fab{display:none}

/* ===== 手机 ===== */
.phone{width:390px;height:844px;border-radius:54px;background:#000;padding:0;position:relative;box-shadow:0 0 0 11px #1d1d20,0 0 0 12px #333,0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.app{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--t1);font-size:15px}
.theme-dark{--bg:#000;--s1:#1C1C1E;--s2:#2C2C2E;--s3:#3A3A3C;--t1:#fff;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--pri:#fff;--priT:#000;--sec:#2C2C2E;--secT:#fff;--ok:#30D158;--warn:#FF9F0A;--bad:#FF453A;--okS:rgba(48,209,88,.16);--warnS:rgba(255,159,10,.16);--badS:rgba(255,69,58,.16);--cap:rgba(0,0,0,.55);--capB:rgba(255,255,255,.22);--mask:rgba(0,0,0,.6);--field:#2C2C2E}
.theme-light{--bg:#F3F4F4;--s1:#FFFFFF;--s2:#EEEEEE;--s3:#E4E4E4;--t1:#000;--t2:#6B6B6B;--t3:#9A9A9A;--sep:#E8E8E8;--pri:#000;--priT:#fff;--sec:#EEEEEE;--secT:#000;--ok:#12B886;--warn:#D58300;--bad:#E5484D;--okS:rgba(18,184,134,.12);--warnS:rgba(213,131,0,.12);--badS:rgba(229,72,77,.1);--cap:rgba(255,255,255,.75);--capB:rgba(0,0,0,.12);--mask:rgba(0,0,0,.4);--field:#F3F4F4}
.sbar{position:absolute;left:0;right:0;top:0;height:47px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 30px 0 36px;font-size:16px;font-weight:600;pointer-events:none}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.9;position:relative}
.sbar .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.nav{position:absolute;top:47px;left:0;right:0;height:44px;z-index:20;display:flex;align-items:center;background:var(--bg)}
.nav.ov{background:transparent}
.nav .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.nav .back svg{width:24px;height:24px}
.nav .tt{position:absolute;left:100px;right:100px;text-align:center;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.cap{position:absolute;right:7px;top:53px;width:87px;height:32px;border-radius:16px;background:var(--cap);border:.5px solid var(--capB);display:flex;align-items:center;z-index:25}
.cap span{flex:1;display:flex;align-items:center;justify-content:center;height:100%}
.cap i{width:.5px;height:18px;background:var(--capB)}
.cap .dots{display:flex;gap:3px}.cap .dots b{width:5px;height:5px;border-radius:50%;background:var(--t1)}
.cap .ring{flex:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--t1);position:relative}
.cap .ring:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--t1)}
.pages{position:absolute;inset:0}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.page .scroll{position:absolute;top:91px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.page .scroll::-webkit-scrollbar{display:none}
.page.hasfoot .scroll{bottom:0;padding-bottom:120px}
.page.under{transform:translateX(-28%);filter:brightness(.55)}
.page.top.push{animation:pin .32s cubic-bezier(.2,.8,.2,1)}
.page.under.push{animation:uout .32s cubic-bezier(.2,.8,.2,1)}
.page.top.pop{animation:pout .28s cubic-bezier(.4,0,1,1) forwards}
.page.under.pop{animation:uin .28s cubic-bezier(.4,0,1,1) forwards}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}
@keyframes uout{from{transform:none;filter:none}to{transform:translateX(-28%);filter:brightness(.55)}}
@keyframes pout{from{transform:none}to{transform:translateX(100%)}}
@keyframes uin{from{transform:translateX(-28%);filter:brightness(.55)}to{transform:none;filter:none}}
.page.top{box-shadow:-12px 0 30px rgba(0,0,0,.35)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--t1);opacity:.85;z-index:60;pointer-events:none}

/* 大标题 cy-page-title */
.lt{padding:24px 16px 8px;font-size:29px;font-weight:800;line-height:1.22;letter-spacing:-.4px}
.lt-sub{padding:0 16px 8px;font-size:14px;color:var(--t2)}
/* 分组卡片 */
.gt{display:flex;justify-content:space-between;align-items:baseline;padding:22px 16px 8px;font-size:18px;font-weight:700}
.gt small{font-size:13px;font-weight:400;color:var(--t2)}
.group{margin:0 16px;background:var(--s1);border-radius:16px;overflow:hidden}
.theme-light .group{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.group+.group{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative;min-height:52px}
.row+.row:before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row.tap{cursor:pointer}.row.tap:active{background:var(--s2)}
.row .ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{display:block;font-size:13px;color:var(--t2);margin-top:2px}
.row .v{font-size:15px;color:var(--t2);text-align:right;white-space:nowrap}
.row .v.b{color:var(--t1);font-weight:700}
.chev{width:8px;height:8px;border-right:2px solid var(--t3);border-top:2px solid var(--t3);transform:rotate(45deg);flex:none;margin-left:2px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;font-size:14px}
.kv span{color:var(--t2)}.kv b{font-weight:600;text-align:right}
.kv+.kv{border-top:.5px solid var(--sep)}
/* 按钮 */
.pill{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:25px;background:var(--pri);color:var(--priT);font-size:17px;font-weight:700;width:100%}
.spill{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:25px;background:var(--sec);color:var(--secT);font-size:17px;font-weight:600;width:100%}
.pill.sm,.spill.sm{height:34px;border-radius:17px;font-size:14px;width:auto;padding:0 16px;display:inline-flex}
.pill[disabled],.pill.dis{opacity:.35;pointer-events:none}
.danger{color:var(--bad)!important}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px;background:var(--bg);z-index:10}
.foot:before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.foot .hint{font-size:12px;color:var(--t2);text-align:center;margin-bottom:8px}
/* 标签 */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--s2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okS);color:var(--ok)}.chip.warn{background:var(--warnS);color:var(--warn)}.chip.bad{background:var(--badS);color:var(--bad)}
.chip.inv{background:var(--pri);color:var(--priT)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
/* Nike 风大数字 + 统计格 */
.huge{font-style:italic;font-weight:900;font-size:76px;line-height:.95;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.huge.m{font-size:54px;letter-spacing:-2px}
.huge small{font-size:22px;letter-spacing:0;margin-left:4px;font-weight:800}
.hero{padding:16px 16px 4px}
.hero .lab{font-size:13px;color:var(--t2);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);margin:0 16px;border-radius:16px;overflow:hidden}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stats>div{background:var(--s1);padding:14px 12px}
.stats b{display:block;font-style:italic;font-weight:900;font-size:26px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--t2)}
/* 六边形奖章 */
.hex{width:88px;height:100px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#000;font-weight:900;font-style:italic}
.hex.bronze{background:linear-gradient(150deg,#F4C9A0,#A8653A)}
.hex.silver{background:linear-gradient(150deg,#F5F5F7,#8E8E93)}
.hex.gold{background:linear-gradient(150deg,#FFE9A3,#C99A1A)}
.hex.dim{background:var(--s2);color:var(--t3)}
.hex b{font-size:26px;line-height:1}.hex small{font-size:10px;font-style:normal;font-weight:700}
/* 封面占位 */
.cover{border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#3a2f5b,#0f2a3d 55%,#1d4d3a)}
.cover.c2{background:linear-gradient(135deg,#5b2f2f,#2a1c0f 60%,#4d3a1d)}
.cover.c3{background:linear-gradient(135deg,#1f3b5b,#0f1f2a 60%,#2a4d5d)}
.cover.c4{background:linear-gradient(135deg,#d9d4cc,#a99f92)}
.cover .shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
.cover .ct{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.cover .ct b{display:block;font-size:20px;font-weight:800}
.cover .ct small{font-size:12px;opacity:.8}
.thumb{width:56px;height:56px;border-radius:12px;flex:none}
/* 横幅 */
.banner{margin:8px 16px 0;padding:12px 14px;border-radius:14px;background:var(--s1);display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.banner.ok{background:var(--okS)}.banner.warn{background:var(--warnS)}.banner.bad{background:var(--badS)}
.banner b{display:block;font-size:14px}
.banner .dot{margin-top:6px}
.code{font:600 12px ui-monospace,Menlo,monospace;color:var(--t2)}
/* 表单 */
.field{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.field+.field:before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.field label{width:76px;flex:none;font-size:15px}
.field input,.field textarea,.field select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;text-align:right}
.field textarea{text-align:left;height:72px;resize:none;background:var(--field);border-radius:10px;padding:10px}
.field input::placeholder,.field textarea::placeholder{color:var(--t3)}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{padding:8px 14px;border-radius:18px;background:var(--s2);font-size:14px}
.opt button.on{background:var(--pri);color:var(--priT);font-weight:700}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--t3);flex:none;position:relative}
.radio.on{border-color:var(--t1);background:var(--t1)}
.radio.on:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
/* 底部弹层 */
.mask{position:absolute;inset:0;background:var(--mask);z-index:40;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--s1);border-radius:16px 16px 0 0;max-height:86%;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.theme-dark .sheet{background:#1C1C1E}
.sheet.closing{animation:down .22s forwards}.mask.closing{animation:fadeo .22s forwards}
.grab{width:36px;height:5px;border-radius:3px;background:var(--t3);margin:8px auto 4px;flex:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.sh b{font-size:20px;font-weight:800}
.sh .x{width:30px;height:30px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2)}
.sb{overflow:auto;padding:0 0 8px;flex:1}
.sb .group{margin:0 16px;background:var(--s2)}
.theme-light .sb .group{background:var(--bg);box-shadow:none}
.sf{padding:10px 16px 34px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
/* 确认框（wx.showModal 样式） */
.modal{position:absolute;left:44px;right:44px;top:50%;transform:translateY(-50%);z-index:51;background:var(--s1);border-radius:14px;overflow:hidden;text-align:center;animation:pop .2s}
.theme-dark .modal{background:#2C2C2E}
.modal h4{font-size:17px;font-weight:700;padding:22px 18px 6px}
.modal p{font-size:14px;color:var(--t2);padding:0 18px 20px;line-height:1.5}
.modal .mb{display:flex;border-top:.5px solid var(--sep)}
.modal .mb button{flex:1;height:50px;font-size:17px}
.modal .mb button+button{border-left:.5px solid var(--sep);font-weight:700}
.mask.m2{z-index:50}
@keyframes pop{from{transform:translateY(-50%) scale(1.1);opacity:0}}
/* toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:70;background:rgba(40,40,42,.96);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:300px;text-align:center;animation:fade .2s;pointer-events:none}
.theme-light .toast{background:rgba(0,0,0,.82)}
/* 状态 */
.stv{display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 36px 0;gap:10px}
.stv .big{width:72px;height:72px;border-radius:50%;background:var(--s1);display:flex;align-items:center;justify-content:center;font-size:30px}
.stv b{font-size:18px}.stv p{font-size:14px;color:var(--t2);line-height:1.5}
.stv .pill{width:auto;padding:0 26px;margin-top:8px}
.sk{background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:300% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--t1);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* 进度钟 / 骰子 / 属性条 */
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--t1)}
.d20{width:120px;height:120px;margin:0 auto;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,#fff,#9a9aa0);color:#000;display:flex;align-items:center;justify-content:center;font-style:italic;font-weight:900;font-size:52px;letter-spacing:-2px}
.d20.rolling{animation:shake .12s infinite}
.d20.crit{background:linear-gradient(160deg,#FFE9A3,#C99A1A)}
.d20.fum{background:linear-gradient(160deg,#ff9a93,#8f1f1a);color:#fff}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.pips{display:flex;gap:5px}.pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--t2)}.pips i.on{background:var(--t1);border-color:var(--t1)}
.stars{letter-spacing:2px;color:var(--t1)}.stars em{font-style:normal;color:var(--t3)}
/* 票券（白色入场码）*/
.ticket{margin:8px auto 0;width:300px;background:#fff;color:#0A0A0A;border-radius:22px;overflow:hidden;text-align:center}
.ticket .tt1{font-size:30px;font-weight:800;padding:22px 0 10px}
.ticket .qr{width:150px;height:150px;margin:0 auto 18px;border-radius:12px;background:
 conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/18px 18px;position:relative}
.ticket .qr:after{content:"";position:absolute;inset:55px;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 6px #000}
.ticket .notch{background:#000;color:#fff;font:700 20px ui-monospace,Menlo,monospace;padding:14px 0;letter-spacing:1px}
.ticket .tf{padding:14px 18px 20px;font-size:13px;color:#6A7282}
.ticket .tf b{display:block;color:#0A0A0A;font-size:17px;margin-top:4px}

<body>
<div class="desk">
  <nav class="rail" id="rail"></nav>
  <main class="stage" id="stage"><div class="scaler" id="scaler"></div></main>
  <aside class="panel" id="panel"></aside>
</div>
<button class="fab l" data-dr="l">目录</button>
<button class="fab r" data-dr="r">面板</button>
<div class="scrim" data-dr="x"></div>
<script>
/* ================= 核心：注册表 / 状态 / 渲染 / 交互 ================= */
'use strict';
const SC = {};   // 屏：id -> {f,t,lt,parent,ep[],theme,render(p),foot(p),gate}
const SH = {};   // 底部弹层：id -> {t,render(p),foot(p)}
const ADLG = {}; // 后台对话框 / 抽屉
const A = {};    // 交互动作
const FEATS = [];
const S = { feat: 'home', stacks: {}, st: 'ok', flags: {}, sheet: null, modal: null, adlg: null, anim: null, form: {}, d: {} };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const F = k => !!S.flags[k];
const feat = k => FEATS.find(f => f.k === k);
const stack = () => S.stacks[S.feat] || [];
const curE = () => { const s = stack(); return s[s.length - 1]; };
const yuan = c => '¥' + (c / 100).toFixed(2);
const pts = c => (c / 100).toFixed(c % 100 ? 1 : 0);
const rid = p => (p || 'req') + '_' + Math.random().toString(36).slice(2, 10);
const chev = '<i class="chev"></i>';

/* ---------- 导航 ---------- */
function pathOf(id) { const p = []; while (id) { p.unshift(id); id = SC[id] && SC[id].parent; } return p; }
function openFeat(k, id) {
  S.feat = k; S.sheet = null; S.modal = null; S.adlg = null; S.st = 'ok'; S.anim = null;
  const f = feat(k);
  if (f) S.stacks[k] = pathOf(id || f.root).map(x => ({ id: x, p: {} }));
  closeDrawers(); render();
}
function push(id, p) { if (!SC[id]) return toast('原型未包含该页'); stack().push({ id, p: p || {} }); S.st = 'ok'; S.anim = 'push'; render(); S.anim = null; }
function pop() {
  if (stack().length <= 1) return toast('已是本功能首页');
  S.anim = 'pop'; render();
  setTimeout(() => { stack().pop(); S.anim = null; S.st = 'ok'; render(); }, 270);
}
function replaceTop(id, p) { const s = stack(); s[s.length - 1] = { id, p: p || {} }; render(); }
function openSheet(id, p) { S.sheet = { id, p: p || {} }; render(); }
function closeSheet(cb) {
  const sh = document.querySelector('.sheet'), m = document.querySelector('.mask.ms');
  if (sh) sh.classList.add('closing'); if (m) m.classList.add('closing');
  setTimeout(() => { S.sheet = null; render(); cb && cb(); }, 200);
}
function confirmBox(o) { S.modal = o; render(); }
let toastT;
function toast(msg) {
  const host = document.querySelector('.app') || document.querySelector('.adm');
  if (!host) return;
  host.querySelectorAll('.toast,.toastA').forEach(e => e.remove());
  const t = document.createElement('div'); t.className = host.classList.contains('adm') ? 'toastA' : 'toast'; t.textContent = msg;
  host.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1900);
}
function later(ms, fn) { setTimeout(fn, ms); }
/* 模拟一次请求：先 loading 再回调 */
function req(fn, ms) {
  const host = document.querySelector('.app');
  if (host) { const l = document.createElement('div'); l.className = 'mask m2'; l.style.background = 'transparent'; l.innerHTML = '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(40,40,42,.92);border-radius:14px;padding:18px"><div class="spin" style="border-color:#555;border-top-color:#fff"></div></div>'; host.appendChild(l); }
  setTimeout(fn, ms || 550);
}

/* ---------- 渲染 ---------- */
function render() {
  const sc = document.querySelector('.page.top .scroll');
  const keep = sc && !S.anim ? sc.scrollTop : 0;
  renderRail(); renderPanel(); renderStage();
  if (keep) { const n = document.querySelector('.page.top .scroll'); if (n) n.scrollTop = keep; }
  fit();
}
const SBAR = '<div class="sbar"><span>9:41</span><span class="ic"><svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.5L2 4.6a8.4 8.4 0 0 1 6-2.4zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4zm0 3.2c.6 0 1.1.2 1.5.6L8 10.7 6.5 9.2c.4-.4.9-.6 1.5-.6z" fill="currentColor"/></svg><span class="bat"></span></span></div>';
const CAP = '<div class="cap"><span><span class="dots"><b></b><b></b><b></b></span></span><i></i><span><span class="ring"></span></span></div>';
const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

function renderStage() {
  const stg = $('#stage'), host = $('#scaler');
  stg.classList.remove('isphone', 'isadm', 'isov');
  if (S.feat === 'home') { stg.classList.add('isov'); host.innerHTML = overview(); return; }
  const f = feat(S.feat);
  if (f.admin) { stg.classList.add('isadm'); host.innerHTML = adminHtml(); return; }
  stg.classList.add('isphone');
  const st = stack(), n = st.length, tsc = SC[st[n - 1].id];
  const theme = tsc.theme || f.theme;
  let h = `<div class="phone"><div class="app theme-${theme}">${SBAR}<div class="pages">`;
  for (let i = Math.max(0, n - 2); i < n; i++) h += pageHtml(st[i], i === n - 1 ? 'top' : 'under', i);
  h += '</div>' + CAP + sheetHtml() + modalHtml() + '<div class="home-ind"></div></div></div>';
  host.innerHTML = h;
}
function pageHtml(e, pos, idx) {
  const sc = SC[e.id], p = e.p || {};
  const live = pos === 'top' && S.st !== 'ok' && S.st !== 'recovered';
  let body;
  try { body = live ? stateView(sc) : sc.render(p); } catch (err) { body = `<div class="stv"><b>渲染出错</b><p>${esc(err.message)}</p></div>`; console.error(err); }
  if (pos === 'top' && S.st === 'recovered') body = `<div class="banner ok"><span class="dot ok"></span><div><b>已恢复</b>网络恢复后重新拉取了本页数据（同一 requestId / idempotencyKey 可安全重放）。</div></div>` + body;
  const foot = !live && sc.foot ? sc.foot(p) : '';
  const cls = ['page', pos, S.anim || '', foot ? 'hasfoot' : ''].join(' ');
  const title = sc.lt ? '' : (typeof sc.t === 'function' ? sc.t(p) : sc.t);
  const navCls = sc.navOv ? 'nav ov' : 'nav';
  return `<section class="${cls}"><div class="${navCls}">${idx > 0 ? `<button class="back" data-a="back">${BACK}</button>` : ''}<div class="tt">${esc(title || '')}</div></div><div class="scroll">${sc.lt && !live ? `<div class="lt">${esc(typeof sc.lt === 'function' ? sc.lt(p) : sc.lt)}</div>` : ''}${sc.lt && live ? `<div class="lt">${esc(typeof sc.lt === 'function' ? sc.lt(p) : sc.lt)}</div>` : ''}${body}<div class="spacer"></div></div>${foot ? `<div class="foot">${foot}</div>` : ''}</section>`;
}
function stateView(sc) {
  const f = feat(sc.f);
  const g = sc.gate || f.gate;
  switch (S.st) {
    case 'loading': return `<div class="pad mt8"><div class="sk" style="height:150px"></div><div class="sk mt16" style="height:22px;width:40%"></div><div class="sk mt12" style="height:64px"></div><div class="sk mt12" style="height:64px"></div><div class="sk mt12" style="height:64px"></div></div>`;
    case 'empty': return `<div class="stv"><div class="big">∅</div><b>${esc(sc.empty || '暂无内容')}</b><p>${esc(sc.emptyHint || '接口返回空列表时展示；不造假数据。')}</p></div>`;

    return `<div class="card"><div class="q"><label>状态</label><span class="ip">待复核 ▾</span><label>主题</label><span class="ip">topicId</span><button class="eb p">搜索</button></div>
    <table><tr><th>复核单</th><th>主题</th><th>风险</th><th>核销率</th><th>一分钟内</th><th>商家补充材料</th><th>状态</th><th>操作</th></tr>
    ${f4().verdicts.map(v => `<tr><td>${v.reviewId}</td><td>${v.topic}</td><td>${v.riskType}</td><td>${v.rate}%</td><td>${v.oneMin}</td><td><span style="border:1px dashed #E6A23C;padding:2px 6px;border-radius:3px;color:#E6A23C">${v.evidence.length} 条（提议）</span></td><td>${['<span class="et w">待复核</span>', '<span class="et s">正常</span>', '<span class="et d">异常</span>'][v.status]}</td><td>${v.status === 0 ? `<button class="eb txt" data-a="admVerify" data-id="${v.reviewId}" data-s="1">确认正常</button><button class="eb txt" style="color:#F56C6C" data-a="admVerify" data-id="${v.reviewId}" data-s="2">确认异常</button>` : ''}</td></tr>`).join('')}</table>
    <div class="warnbox" style="margin:12px 0 0">「商家补充材料」列是提议：现在后台读不到 verification_review_evidence，只有商家端能看。</div></div>`;
  },
};
A.admVerify = (el, ds) => confirmAdm(`确认将复核单 ${ds.id} 标记为「${ds.s === '1' ? '正常' : '异常'}」？`, () => { f4().verdicts.find(x => x.reviewId == ds.id).status = +ds.s; render(); toast('已处理（记入操作日志）'); });
function confirmAdm(msg, ok) { admOpen('adm-confirm', { msg }); A._admOk = ok; }
ADLG['adm-confirm'] = { t: '系统提示', render: p => `<div style="padding:6px 0 10px">⚠️ ${esc(p.msg)}</div>`, foot: () => `<button class="eb" data-a="admClose">取 消</button><button class="eb p" data-a="admConfirmOk">确 定</button>` };
A.admConfirmOk = () => { S.adlg = null; A._admOk && A._admOk(); };
SC['adm-invoice'] = {
  f: 'adm', grp: 'F7 合规', nm: '用户发票', t: '用户发票',
  ep: ['!POST （用户发票开具 / 驳回） | IUserInvoiceService.markIssued / markRejected 没有控制器；提议新增'],
  render() {
    const st = { SUBMITTED: '<span class="et w">待开票</span>', ISSUED: '<span class="et s">已开票</span>', REJECTED: '<span class="et d">已驳回</span>', CANCELLED: '<span class="et i">已撤回</span>' };
    return `<div class="card"><div class="warnbox">整页是提议：后端只有玩家端 /api/invoice/*，后台还没有用户发票的列表 / 开具 / 驳回接口。现有「应付批次」里的发票是对公结算发票，不是这个。</div>
    <div class="q"><label>状态</label><span class="ip">待开票 ▾</span><label>申请号</label><span class="ip">INV…</span><button class="eb p">搜索</button></div>
    <table><tr><th>申请号</th><th>抬头</th><th>税号</th><th>订单数</th><th>金额</th><th>申请时间</th><th>状态</th><th>发票号</th><th>操作</th></tr>
    ${f7().apps.slice().reverse().map(a => { const t = f7().titles.find(x => x.id === a.titleId) || { titleName: '（已删除）', titleType: 'PERSONAL' }; return `<tr><td>${a.no}</td><td>${esc(t.titleName)}</td><td>${t.titleType === 'COMPANY' ? maskTax(t.taxNo) : '—'}</td><td>${a.orderIds.length}</td><td>${yuan(a.amt)}</td><td>${a.at}</td><td>${st[a.status]}</td><td>${a.invoiceNo || ''}</td><td>${a.status === 'SUBMITTED' ? `<button class="eb txt" data-a="admInv" data-id="${a.id}" data-m="issue">开具</button><button class="eb txt" style="color:#F56C6C" data-a="admInv" data-id="${a.id}" data-m="reject">驳回</button>` : ''}</td></tr>`; }).join('')}</table>
    <div class="infobox" style="margin:12px 0 0">后台查看税号也只给脱敏值；明文只在开票时由有权限的人单独解密查看（待定）。</div></div>`;
  },
};
A.admInv = (el, ds) => admOpen('adm-inv', ds);
ADLG['adm-inv'] = {
  t: p => p.m === 'issue' ? '回填发票号（人工开具）' : '驳回开票申请',
  render(p) { return p.m === 'issue' ? `<div class="fr"><label>发票号码</label><input name="admInvNo" value="${esc(fv('admInvNo', '26312000000098765432'))}"></div>` : `<div class="fr"><label>驳回原因</label><textarea name="admInvR">${esc(fv('admInvR', '抬头与税号不一致'))}</textarea></div>`; },
  foot(p) { return `<button class="eb" data-a="admClose">取 消</button><button class="eb p" data-a="admInvOk" data-id="${p.id}" data-m="${p.m}">确 定</button>`; },
};
A.admInvOk = (el, ds) => { const a = f7().apps.find(x => x.id == ds.id); if (ds.m === 'issue') { a.status = 'ISSUED'; a.invoiceNo = fv('admInvNo', '26312000000098765432'); } else { a.status = 'REJECTED'; a.reason = fv('admInvR', '抬头与税号不一致'); } S.adlg = null; render(); toast('已更新（玩家端同步可见）'); };
const TRAIL = [['10-23 19:41:06', 'BUSINESS_AUDIT_EVENT', 'ARRIVE_REJECTED', 'SYSTEM', 'ARRIVE_GUARD_SPEED', '速度 11.6 m/s'], ['10-23 19:44:30', 'AUDIT_RECORD', 'APPEAL_SUBMITTED', 'MEMBER', '', '定位漂移'], ['10-23 20:02:11', 'AUDIT_RECORD', 'CLAIMED', 'ADMIN', '', 'admin'], ['10-23 20:05:48', 'AUDIT_RECORD', 'APPROVED', 'ADMIN', 'GPS_DRIFT', '补记到达'], ['10-23 20:05:49', 'BUSINESS_AUDIT_EVENT', 'ARRIVE_BACKFILLED', 'SYSTEM', '', '']];
function trailTable() { return `<table><tr><th>时间</th><th>来源</th><th>动作</th><th>操作方</th><th>原因码</th><th>说明</th></tr>${TRAIL.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`; }
SC['adm-trail'] = {
  f: 'adm', grp: '审计', nm: '统一留痕', t: '统一留痕', gate: { flag: 'chengyin.audit.o5c.unified-trail.enabled', code: 'AUDIT_TRAIL_DISABLED', msg: '统一留痕未开启' },
  ep: ['GET /business/audit-trail | bizType, bizId → source, action, operatorType, reasonCode, eventTime（每源 ≤200、总 ≤500）'],
  render() {
    if (!F('trail')) return `<div class="card"><div class="warnbox">AUDIT_TRAIL_DISABLED：开关 chengyin.audit.o5c.unified-trail.enabled 关闭，接口 404。</div></div>`;
    return `<div class="card"><div class="q"><label>业务类型</label><span class="ip">play_arrive_guard</span><label>业务 ID</label><span class="ip">551820</span><button class="eb p">查询</button></div>
    <div class="infobox">合并 5 个来源：AUDIT_RECORD、BUSINESS_AUDIT_EVENT、POST_ENFORCEMENT、REPORT_TIMELINE、OFFICIAL_EVENT_AUDIT_LOG，按时间排序。</div>${trailTable()}</div>`;
  },
};
A.admTrail = (el, ds) => F('trail') ? admOpen('adm-trail-drw', ds) : toast('统一留痕未开启（AUDIT_TRAIL_DISABLED）');
ADLG['adm-trail-drw'] = { drawer: true, t: p => `完整留痕 · ${p.biz} #${p.id}`, render: () => `<div class="infobox">GET /business/audit-trail?bizType=…&bizId=…</div>${TRAIL.map(r => `<div class="tlr"><span class="t">${r[0]}</span><div><b>${r[2]}</b> · ${r[3]}${r[4] ? ' · ' + r[4] : ''}<div style="color:#909399">${r[1]}${r[5] ? ' · ' + r[5] : ''}</div></div></div>`).join('')}` };

/* ================= 启动 ================= */
const _push = push;
push = function (id, p) { if (id === 'f2-check' || id === 'f6-check') R().chk = chkNew(); return _push(id, p); };
const _openFeat = openFeat;
openFeat = function (k, id) { if (S.d.rpg && (id === 'f2-check' || id === 'f6-check' || k === 'f2' || k === 'f6')) R().chk = chkNew(); return _openFeat(k, id); };
(function boot() {
  f1Init(); rpgInit(); f3Init(); f7Init(); f4Init();
  FEATS.forEach(f => (f.toggles || []).forEach(t => { S.flags[t.id] = !['guardShadow', 'requireAcc', 'forceFail', 'forceCrit', 'minorOrienteeringGate'].includes(t.id); }));
  FEATS.forEach(f => S.stacks[f.k] = pathOf(f.root).map(id => ({ id, p: {} })));
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && SC[h]) openFeat(SC[h].f, h); else if (h && feat(h)) openFeat(h); else render();
  window.addEventListener('hashchange', () => { const x = decodeURIComponent(location.hash.slice(1)); if (SC[x]) openFeat(SC[x].f, x); else if (feat(x) || x === 'home') openFeat(x); });
})();
</script>
